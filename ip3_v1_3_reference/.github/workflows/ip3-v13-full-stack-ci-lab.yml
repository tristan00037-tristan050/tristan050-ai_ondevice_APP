name: IP3 v1.3 Full Stack CI Lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tools/**"
      - "tests/**"
      - "scripts/ops/**"
      - "schema/**"
      - "evidence/**"
      - ".github/workflows/ip3-v13-full-stack-ci-lab.yml"

jobs:
  telemetry:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit and core gates
        shell: bash
        run: |
          python tools/run_unit_tests.py .
          python tools/routing_schema_gate.py .
          python tools/threat_model_gate.py .
          python tools/evidence_taxonomy_gate.py .
      - name: Collect platform telemetry
        shell: bash
        run: |
          python tools/collect_real_telemetry.py . --device-id "${{ matrix.os }}" --evidence-class ci_lab
      - name: Upload platform telemetry
        uses: actions/upload-artifact@v4
        with:
          name: ip3-v13-telemetry-${{ matrix.os }}
          path: |
            evidence/real_telemetry_current_platform.json
            evidence/real_telemetry_linux.json
            evidence/real_telemetry_darwin.json
            evidence/real_telemetry_windows.json

  aggregate:
    needs: telemetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Import telemetry artifacts
        run: |
          python tools/import_ci_artifacts.py . downloaded-artifacts
      - name: Run aggregate gates
        run: |
          python tools/all_platform_telemetry_gate.py . --require-platforms linux,darwin,windows --strict --expected-evidence-class ci_lab
          python tools/windows_real_telemetry_gate.py . --expected-evidence-class ci_lab
          python tools/claim_guard.py .
          python tools/raw_content_scan_gate.py .
          python tools/clean_package_gate.py .
          python tools/sha256_manifest.py .
      - name: Upload sealed handoff candidate
        uses: actions/upload-artifact@v4
        with:
          name: ip3-v13-full-stack-ci-lab-handoff
          path: |
            evidence/**
            docs/**
            schema/**
