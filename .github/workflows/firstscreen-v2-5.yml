name: firstscreen-v2-5-product-gate

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firstscreen-v2-5-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'
  RUST_TOOLCHAIN: '1.97.1'

jobs:
  scope-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {fetch-depth: 0}
      - name: Enforce protected product scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}"; then base="$(git rev-parse HEAD^)"; fi
          python scripts/release/firstscreen_source_contracts.py --check-unchanged "${base}" HEAD
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-firstscreen-ci.lock
      - run: python -m pip install --require-hashes -r requirements-firstscreen-ci.lock
      - name: Compile and execute v2.5 trust, identity, and export contracts
        run: |
          python -m compileall -q butler_pc_core scripts/release scripts/verify tests/firstscreen_v2_5
          python -m pytest -q tests/firstscreen_v2_5 tests/test_storage_risk_acceptance.py tests/test_safe_source_archive.py tests/test_source_bundle_portability.py --junitxml=firstscreen-v2-5.xml --cov=butler_pc_core.firstscreen_trust --cov-branch --cov-report=xml:firstscreen-v2-5-coverage.xml --cov-fail-under=85
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firstscreen-v2-5-contract-evidence
          path: |
            firstscreen-v2-5.xml
            firstscreen-v2-5-coverage.xml
          if-no-files-found: error
          retention-days: 30

  desktop-web:
    runs-on: ubuntu-latest
    needs: scope-and-contracts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '${{ env.PYTHON_VERSION }}'}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: butler-desktop/package-lock.json
          package-manager-cache: true
      - name: Produce source identity and immutable production context
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}"; then base="$(git rev-parse HEAD^)"; fi
          mkdir -p "${RUNNER_TEMP}/firstscreen"
          python scripts/release/build_safe_source_archive.py --commit HEAD --scope-baseline "${base}" --output "${RUNNER_TEMP}/firstscreen/source.zip" --manifest "${RUNNER_TEMP}/firstscreen/SOURCE_ARCHIVE_MANIFEST.json"
          python scripts/release/build_with_git.py --output "${RUNNER_TEMP}/firstscreen/BUILD_CONTEXT.json" --source-manifest "${RUNNER_TEMP}/firstscreen/SOURCE_ARCHIVE_MANIFEST.json" --repository "${GITHUB_REPOSITORY}" --workflow-identity "${GITHUB_WORKFLOW_REF}" --toolchain-identity "python=${PYTHON_VERSION};node=${NODE_VERSION};rust=${RUST_TOOLCHAIN}" --baseline "${base}"
          python scripts/verify/verify_build_context.py "${RUNNER_TEMP}/firstscreen/BUILD_CONTEXT.json"
          python scripts/release/verify_source_bundle.py --archive "${RUNNER_TEMP}/firstscreen/source.zip" --manifest "${RUNNER_TEMP}/firstscreen/SOURCE_ARCHIVE_MANIFEST.json" --extract-to "${RUNNER_TEMP}/firstscreen/no-git"
          (
            cd "${RUNNER_TEMP}/firstscreen/no-git/source"
            test ! -e .git
            python "${GITHUB_WORKSPACE}/scripts/release/verify_source_bundle.py" --source-root . --manifest "${RUNNER_TEMP}/firstscreen/SOURCE_ARCHIVE_MANIFEST.json" --archive "${RUNNER_TEMP}/firstscreen/source.zip"
          )
      - working-directory: butler-desktop
        run: npm ci
      - working-directory: butler-desktop
        run: npm audit --audit-level=high
      - working-directory: butler-desktop
        run: npm run test:run -- --reporter=default --reporter=junit --outputFile.junit=vitest-junit.xml
      - working-directory: butler-desktop
        env:
          BUTLER_BUILD_CONTEXT_PATH: ${{ runner.temp }}/firstscreen/BUILD_CONTEXT.json
        run: npm run build
      - name: Verify immutable context digest in production bytes
        shell: bash
        run: |
          set -euo pipefail
          digest="$(python scripts/verify/verify_build_context.py "${RUNNER_TEMP}/firstscreen/BUILD_CONTEXT.json" | python -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          grep -R --fixed-strings "${digest}" butler-desktop/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firstscreen-v2-5-web-${{ github.sha }}
          path: |
            butler-desktop/dist/
            butler-desktop/vitest-junit.xml
            ${{ runner.temp }}/firstscreen/BUILD_CONTEXT.json
            ${{ runner.temp }}/firstscreen/SOURCE_ARCHIVE_MANIFEST.json
            ${{ runner.temp }}/firstscreen/source.zip
          if-no-files-found: error
          retention-days: 30

  native-compile:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    needs: desktop-web
    defaults:
      run: {working-directory: butler-desktop}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: {node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: butler-desktop/package-lock.json, package-manager-cache: true}
      - run: npm ci
      - name: Enforce native trust authority and least privilege
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(grep -R -n --fixed-strings '/usr/bin/security' src-tauri/src || true)"
          test -z "$(grep -R -n --fixed-strings 'persist_runtime_trust_receipt' src src-tauri/src || true)"
          python - <<'PY'
          import json
          from pathlib import Path
          capability = json.loads(Path('src-tauri/capabilities/firstscreen-trust.json').read_text())
          assert capability['windows'] == ['main']
          assert 'remote' not in capability
          assert capability['permissions'] == ['allow-verify-and-commit-trust-update']
          default = json.loads(Path('src-tauri/capabilities/default.json').read_text())
          assert 'shell:default' not in default['permissions']
          PY
      - run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component clippy,rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  repository-python:
    runs-on: ubuntu-latest
    needs: scope-and-contracts
    env:
      HOME: ${{ runner.temp }}/home
      BUTLER_APP_DATA_DIR: ${{ runner.temp }}/butler-app-data
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-firstscreen-ci.lock
      - run: python -m pip install --require-hashes -r requirements-firstscreen-ci.lock
      - run: python -m pytest --collect-only -qq
      - run: python -m pytest -q --junitxml=repository-junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: firstscreen-v2-5-repository, path: repository-junit.xml, if-no-files-found: error, retention-days: 30}

  source-attestation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [native-compile, repository-python]
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '${{ env.PYTHON_VERSION }}'}
      - name: Build source and SBOM subjects
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/firstscreen-release"
          mkdir -p "${out}"
          python scripts/release/build_safe_source_archive.py --commit HEAD --scope-baseline HEAD^ --output "${out}/source.zip" --manifest "${out}/SOURCE_ARCHIVE_MANIFEST.json"
          python scripts/release/build_with_git.py --output "${out}/BUILD_CONTEXT.json" --source-manifest "${out}/SOURCE_ARCHIVE_MANIFEST.json" --repository "${GITHUB_REPOSITORY}" --workflow-identity "${GITHUB_WORKFLOW_REF}" --toolchain-identity "python=${PYTHON_VERSION};node=${NODE_VERSION};rust=${RUST_TOOLCHAIN}" --baseline HEAD^
          python scripts/release/generate_cyclonedx_sbom.py --commit HEAD --output "${out}/butler.cdx.json" --build-context "${out}/BUILD_CONTEXT.json" --npm-lock butler-desktop/package-lock.json --python-requirements requirements-firstscreen-ci.lock
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/firstscreen-release/source.zip
          sbom-path: ${{ runner.temp }}/firstscreen-release/butler.cdx.json
      - name: Consumer verification of signer and subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "${RUNNER_TEMP}/firstscreen-release/source.zip" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_WORKFLOW_REF%%@*}"

  gate:
    if: always()
    runs-on: ubuntu-latest
    needs: [scope-and-contracts, desktop-web, native-compile, repository-python, source-attestation]
    steps:
      - name: Enforce event-applicable gates
        env:
          CONTRACTS: ${{ needs.scope-and-contracts.result }}
          WEB: ${{ needs.desktop-web.result }}
          NATIVE: ${{ needs.native-compile.result }}
          REPOSITORY: ${{ needs.repository-python.result }}
          ATTESTATION: ${{ needs.source-attestation.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          test "${CONTRACTS}" = success
          test "${WEB}" = success
          test "${NATIVE}" = success
          test "${REPOSITORY}" = success
          if [ "${EVENT}" = push ] && [ "${REF}" = refs/heads/main ]; then test "${ATTESTATION}" = success; else test "${ATTESTATION}" = skipped; fi
