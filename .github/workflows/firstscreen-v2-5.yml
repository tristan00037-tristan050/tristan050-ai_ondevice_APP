name: firstscreen-v2-5-product-gate

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firstscreen-v2-5-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'
  RUST_TOOLCHAIN: '1.97.1'
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  scope-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {ref: '${{ env.PR_HEAD_SHA }}', fetch-depth: 0}
      - name: Enforce protected product scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}"; then base="$(git rev-parse HEAD^)"; fi
          python scripts/release/firstscreen_source_contracts.py --check-unchanged "${base}" HEAD
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-firstscreen-ci.lock
      - run: python -m pip install --require-hashes -r requirements-firstscreen-ci.lock
      - name: Compile and execute v2.5 trust, identity, and export contracts
        run: |
          python -m compileall -q butler_pc_core scripts/release scripts/verify tests/firstscreen_v2_5
          python -m pytest -q tests/firstscreen_v2_5 tests/test_storage_risk_acceptance.py tests/test_safe_source_archive.py tests/test_source_bundle_portability.py --junitxml=firstscreen-v2-5.xml --cov=butler_pc_core.firstscreen_trust --cov-branch --cov-report=xml:firstscreen-v2-5-coverage.xml --cov-fail-under=85
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firstscreen-v2-5-contract-evidence
          path: |
            firstscreen-v2-5.xml
            firstscreen-v2-5-coverage.xml
          if-no-files-found: error
          retention-days: 30

  desktop-web:
    runs-on: ubuntu-latest
    needs: scope-and-contracts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {ref: '${{ env.PR_HEAD_SHA }}', fetch-depth: 0}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '${{ env.PYTHON_VERSION }}'}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: butler-desktop/package-lock.json
          package-manager-cache: true
      - name: Install hash-locked sidecar dependencies
        run: python -m pip install --require-hashes -r requirements-firstscreen-ci.lock
      - name: Produce source identity and immutable production context
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}"; then base="$(git rev-parse HEAD^)"; fi
          mkdir -p "${RUNNER_TEMP}/firstscreen"
          python scripts/release/build_safe_source_archive.py --commit HEAD --scope-baseline "${base}" --output "${RUNNER_TEMP}/firstscreen/source.zip" --manifest "${RUNNER_TEMP}/firstscreen/SOURCE_ARCHIVE_MANIFEST.json"
          python scripts/release/build_with_git.py --output "${RUNNER_TEMP}/firstscreen/BUILD_CONTEXT.json" --source-manifest "${RUNNER_TEMP}/firstscreen/SOURCE_ARCHIVE_MANIFEST.json" --repository "${GITHUB_REPOSITORY}" --workflow-identity "${GITHUB_WORKFLOW_REF}" --toolchain-identity "python=${PYTHON_VERSION};node=${NODE_VERSION};rust=${RUST_TOOLCHAIN}" --baseline "${base}"
          python scripts/verify/verify_build_context.py "${RUNNER_TEMP}/firstscreen/BUILD_CONTEXT.json"
          python scripts/release/verify_source_bundle.py --archive "${RUNNER_TEMP}/firstscreen/source.zip" --manifest "${RUNNER_TEMP}/firstscreen/SOURCE_ARCHIVE_MANIFEST.json" --build-context "${RUNNER_TEMP}/firstscreen/BUILD_CONTEXT.json" --extract-to "${RUNNER_TEMP}/firstscreen/no-git"
          (
            cd "${RUNNER_TEMP}/firstscreen/no-git/source"
            test ! -e .git
            python "${GITHUB_WORKSPACE}/scripts/release/verify_source_bundle.py" --source-root . --manifest "${RUNNER_TEMP}/firstscreen/SOURCE_ARCHIVE_MANIFEST.json" --build-context "${RUNNER_TEMP}/firstscreen/BUILD_CONTEXT.json" --archive "${RUNNER_TEMP}/firstscreen/source.zip"
          )
      - working-directory: butler-desktop
        run: npm ci
      - working-directory: butler-desktop
        run: npm audit --audit-level=high
      - working-directory: butler-desktop
        run: npm run test:run -- --reporter=default --reporter=junit --outputFile.junit=vitest-junit.xml
      - working-directory: butler-desktop
        env:
          BUTLER_BUILD_CONTEXT_PATH: ${{ runner.temp }}/firstscreen/BUILD_CONTEXT.json
        run: npm run build
      - name: Verify immutable context digest in production bytes
        shell: bash
        run: |
          set -euo pipefail
          digest="$(python scripts/verify/verify_build_context.py "${RUNNER_TEMP}/firstscreen/BUILD_CONTEXT.json" | python -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          grep -R --fixed-strings "${digest}" butler-desktop/dist
      - name: Install pinned Playwright Chromium
        working-directory: butler-desktop
        run: npx playwright install --with-deps chromium
      - name: Execute FirstScreen v5 browser, attack and geometry matrices
        working-directory: butler-desktop
        run: npm run test:e2e -- e2e/firstscreen-v5.spec.ts
      - name: Preserve raw FirstScreen browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firstscreen-v5-playwright-${{ github.sha }}
          path: |
            butler-desktop/test-results/
            butler-desktop/playwright-report/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: firstscreen-v2-5-web-${{ github.sha }}
          path: |
            butler-desktop/dist/
            butler-desktop/vitest-junit.xml
            ${{ runner.temp }}/firstscreen/BUILD_CONTEXT.json
            ${{ runner.temp }}/firstscreen/SOURCE_ARCHIVE_MANIFEST.json
            ${{ runner.temp }}/firstscreen/source.zip
          if-no-files-found: error
          retention-days: 30

  firstscreen-unit:
    name: firstscreen-unit
    runs-on: ubuntu-latest
    needs: scope-and-contracts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PR_HEAD_SHA }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: butler-desktop/package-lock.json
          package-manager-cache: true
      - working-directory: butler-desktop
        run: npm ci
      - name: Execute exact FirstScreen v7 unit contracts
        working-directory: butler-desktop
        run: |
          mkdir -p test-results
          npm run test:run -- \
            src/firstscreen/__tests__/egressDeadline.test.ts \
            src/firstscreen/__tests__/egressState.test.ts \
            src/firstscreen/__tests__/egressMeasurement.test.ts \
            src/settings/__tests__/learningCapability.test.ts \
            --reporter=default \
            --reporter=json \
            --outputFile.json=test-results/vitest-results.json
          node ../scripts/ci/write_firstscreen_test_context.mjs \
            --report test-results/vitest-results.json \
            --output test-results/firstscreen-v9-unit-context.json \
            --subject-head "${PR_HEAD_SHA}" \
            --execution-commit "$(git rev-parse HEAD)" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "${GITHUB_RUN_ID}" \
            --suite firstscreen-learning-unit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firstscreen-v7-unit-${{ env.PR_HEAD_SHA }}
          path: |
            butler-desktop/test-results/vitest-results.json
            butler-desktop/test-results/firstscreen-v9-unit-context.json
          if-no-files-found: error
          retention-days: 30

  firstscreen-learning-backend:
    name: ${{ matrix.job_name }}
    runs-on: ubuntu-latest
    needs: scope-and-contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: firstscreen-learning-contract
            evidence_name: contract
            targets: tests/sidecar/test_learning_capability_route.py
          - job_name: firstscreen-learning-authorities
            evidence_name: authorities
            targets: tests/learning_capability/test_authorities.py
          - job_name: firstscreen-learning-product-integration
            evidence_name: product-integration
            targets: tests/learning_capability/test_snapshot_atomicity.py tests/integration/test_learning_capability_product_path.py
          - job_name: firstscreen-learning-v10-security
            evidence_name: v10-security
            targets: tests/learning_capability/test_v10_security.py
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-firstscreen-ci.lock
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: python -m pip install --require-hashes -r requirements-firstscreen-ci.lock
      - name: Execute exact learning backend nodes
        env:
          PYTEST_TARGETS: ${{ matrix.targets }}
        run: |
          mkdir -p evidence
          read -r -a pytest_targets <<< "${PYTEST_TARGETS}"
          python -m pytest -q "${pytest_targets[@]}" \
            --junitxml="evidence/${{ matrix.evidence_name }}-pytest.xml"
          node scripts/ci/write_firstscreen_test_context.mjs \
            --report "evidence/${{ matrix.evidence_name }}-pytest.xml" \
            --output "evidence/${{ matrix.evidence_name }}-context.json" \
            --subject-head "${PR_HEAD_SHA}" \
            --execution-commit "$(git rev-parse HEAD)" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "${GITHUB_RUN_ID}" \
            --suite "${{ matrix.job_name }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: firstscreen-v9-backend-${{ matrix.evidence_name }}-${{ env.PR_HEAD_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  firstscreen-browser-gates:
    name: ${{ matrix.job_name }}
    runs-on: ubuntu-latest
    needs: scope-and-contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: firstscreen-playwright
            evidence_name: required
            grep: FirstScreen v7 required product paths
          - job_name: firstscreen-learning-real-sidecar
            evidence_name: real-sidecar
            grep: endpoint 가로채기|권위 저장소 하나|실제 sidecar 경로
          - job_name: firstscreen-accessibility
            evidence_name: accessibility
            grep: remains keyboard operable and text-visible at narrow width and 200 percent zoom
          - job_name: firstscreen-existing-regression
            evidence_name: regression
            grep: preserves compact cards answer area folders and conditional setup banner
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PR_HEAD_SHA }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-firstscreen-ci.lock
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: butler-desktop/package-lock.json
          package-manager-cache: true
      - run: python -m pip install --require-hashes -r requirements-firstscreen-ci.lock
      - working-directory: butler-desktop
        run: npm ci
      - working-directory: butler-desktop
        run: npx playwright install --with-deps chromium
      - name: Execute exact FirstScreen browser contract
        working-directory: butler-desktop
        env:
          REQUIRED_TEST_GREP: ${{ matrix.grep }}
        run: |
          mkdir -p test-results
          npx playwright test e2e/firstscreen-v5.spec.ts --grep "${REQUIRED_TEST_GREP}"
          node ../scripts/ci/write_firstscreen_test_context.mjs \
            --report test-results/playwright-results.json \
            --output test-results/firstscreen-v9-${{ matrix.evidence_name }}-context.json \
            --subject-head "${PR_HEAD_SHA}" \
            --execution-commit "$(git rev-parse HEAD)" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "${GITHUB_RUN_ID}" \
            --suite "${{ matrix.job_name }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: firstscreen-v7-browser-${{ matrix.evidence_name }}-${{ env.PR_HEAD_SHA }}
          path: |
            butler-desktop/test-results/
            butler-desktop/playwright-report/
          if-no-files-found: error
          retention-days: 30

  firstscreen-required-node-audit:
    name: firstscreen-required-node-audit
    runs-on: ubuntu-latest
    needs: [firstscreen-unit, firstscreen-learning-backend, firstscreen-browser-gates]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PR_HEAD_SHA }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firstscreen-v7-unit-${{ env.PR_HEAD_SHA }}
          path: evidence/unit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firstscreen-v7-browser-real-sidecar-${{ env.PR_HEAD_SHA }}
          path: evidence/browser
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: firstscreen-v9-backend-*-${{ env.PR_HEAD_SHA }}
          path: evidence/backend
          merge-multiple: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Match required nodes to executed JSON reports
        run: |
          node scripts/ci/test_firstscreen_verifiers.mjs evidence/node-verifier-results.json
          node scripts/ci/write_firstscreen_test_context.mjs \
            --report evidence/node-verifier-results.json \
            --output evidence/node-verifier-context.json \
            --subject-head "${PR_HEAD_SHA}" \
            --execution-commit "$(git rev-parse HEAD)" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "${GITHUB_RUN_ID}" \
            --suite firstscreen-required-verifier-negative-tests
          node butler-desktop/scripts/verify-required-test-nodes.mjs \
            --manifest butler-desktop/acceptance/required-tests.v2.json \
            --vitest evidence/unit/vitest-results.json \
            --playwright evidence/browser/test-results/playwright-results.json \
            --pytest evidence/backend/contract-pytest.xml \
            --pytest evidence/backend/authorities-pytest.xml \
            --pytest evidence/backend/product-integration-pytest.xml \
            --pytest evidence/backend/v10-security-pytest.xml \
            --node evidence/node-verifier-results.json \
            --context evidence/unit/firstscreen-v9-unit-context.json \
            --context evidence/browser/test-results/firstscreen-v9-real-sidecar-context.json \
            --context evidence/backend/contract-context.json \
            --context evidence/backend/authorities-context.json \
            --context evidence/backend/product-integration-context.json \
            --context evidence/backend/v10-security-context.json \
            --context evidence/node-verifier-context.json \
            --head "${PR_HEAD_SHA}" \
            --output evidence/required-node-audit.json
          node scripts/ci/write_firstscreen_test_context.mjs \
            --report evidence/required-node-audit.json \
            --output evidence/firstscreen-v9-required-audit-context.json \
            --subject-head "${PR_HEAD_SHA}" \
            --execution-commit "$(git rev-parse HEAD)" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "${GITHUB_RUN_ID}" \
            --suite firstscreen-required-node-audit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firstscreen-v7-required-node-audit-${{ env.PR_HEAD_SHA }}
          path: |
            evidence/required-node-audit.json
            evidence/node-verifier-results.json
            evidence/node-verifier-context.json
            evidence/firstscreen-v9-required-audit-context.json
          if-no-files-found: error
          retention-days: 30

  firstscreen-evidence-package:
    name: firstscreen-evidence-package
    runs-on: ubuntu-latest
    needs:
      [scope-and-contracts, firstscreen-unit, firstscreen-learning-backend,
       firstscreen-browser-gates, firstscreen-required-node-audit]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firstscreen-v7-unit-${{ env.PR_HEAD_SHA }}
          path: collected/unit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firstscreen-v7-browser-real-sidecar-${{ env.PR_HEAD_SHA }}
          path: collected/browser
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: firstscreen-v9-backend-*-${{ env.PR_HEAD_SHA }}
          path: collected/backend
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firstscreen-v7-required-node-audit-${{ env.PR_HEAD_SHA }}
          path: collected/audit
      - name: Build and independently recheck complete evidence ZIP
        id: package
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}"; then
            base="$(git rev-parse HEAD^)"
          fi
          root="${RUNNER_TEMP}/firstscreen-v10-evidence/package"
          mkdir -p \
            "${root}/source" \
            "${root}/reports" \
            "${root}/contexts" \
            "${root}/manifests"
          git archive --format=zip --output="${root}/source/source.zip" HEAD
          git ls-tree -r --full-tree HEAD > "${root}/source/git-ls-tree.txt"
          git diff --binary "${base}" HEAD > "${root}/source/correction.patch"
          test -s "${root}/source/correction.patch"
          cp collected/unit/vitest-results.json "${root}/reports/"
          cp collected/browser/test-results/playwright-results.json "${root}/reports/"
          cp collected/backend/*-pytest.xml "${root}/reports/"
          cp collected/audit/required-node-audit.json \
            "${root}/reports/required-node-audit.json"
          cp collected/audit/node-verifier-results.json "${root}/reports/"
          cp collected/unit/firstscreen-v9-unit-context.json "${root}/contexts/"
          cp collected/browser/test-results/firstscreen-v9-real-sidecar-context.json \
            "${root}/contexts/"
          cp collected/backend/*-context.json "${root}/contexts/"
          cp collected/audit/*-context.json "${root}/contexts/"
          cp butler-desktop/acceptance/required-tests.v2.json \
            "${root}/manifests/"
          cp butler-desktop/acceptance/action-pins.v1.json \
            "${root}/manifests/"
          git diff --name-status "${base}" HEAD > \
            "${root}/manifests/changed-files.txt"
          git ls-files \
            butler_pc_core/learning_capability \
            butler_pc_core/strict_json.py \
            butler_pc_core/app_data.py \
            butler_pc_core/sidecar/routes/learning_capability.py \
            butler-desktop/src/settings/learningCapability.ts \
            butler-desktop/e2e/firstscreen-v5.spec.ts \
            scripts/ci \
            tests/learning_capability \
            tests/sidecar/test_learning_capability_route.py \
            > "${root}/manifests/module-closure.txt"
          node scripts/ci/build_firstscreen_evidence_index.mjs \
            --package "${root}" \
            --repository "${GITHUB_REPOSITORY}" \
            --pull-request "886" \
            --head "${PR_HEAD_SHA}" \
            --tree "$(git rev-parse 'HEAD^{tree}')"
          (
            cd "${root}"
            checksum_file="${RUNNER_TEMP}/firstscreen-v10-SHA256SUMS.txt"
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \\./#  #' > "${checksum_file}"
            mv "${checksum_file}" SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          archive="${RUNNER_TEMP}/firstscreen-v10-evidence.zip"
          (
            cd "${RUNNER_TEMP}/firstscreen-v10-evidence"
            zip -X -q -r "${archive}" package
          )
          sha256sum "${archive}" > "${archive}.sha256"
          mkdir -p "${RUNNER_TEMP}/firstscreen-v10-recheck"
          unzip -q "${archive}" -d "${RUNNER_TEMP}/firstscreen-v10-recheck"
          (
            cd "${RUNNER_TEMP}/firstscreen-v10-recheck/package"
            sha256sum -c SHA256SUMS.txt
          )
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
      - name: Create hosted artifact attestation
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Verify detached digest, extracted payload and hosted attestation
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "${ATTESTATION_BUNDLE}"
          node scripts/ci/verify_firstscreen_evidence_package.mjs \
            --package "${RUNNER_TEMP}/firstscreen-v10-recheck/package" \
            --zip "${{ steps.package.outputs.archive }}" \
            --detached "${{ steps.package.outputs.archive }}.sha256" \
            --attestation-bundle "${ATTESTATION_BUNDLE}" \
            --repository "${GITHUB_REPOSITORY}" \
            --pull-request "886" \
            --head "${PR_HEAD_SHA}" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --workflow "${GITHUB_WORKFLOW_REF}" \
            --output "${RUNNER_TEMP}/firstscreen-v10-evidence-verification.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firstscreen-v10-evidence-${{ env.PR_HEAD_SHA }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
            ${{ runner.temp }}/firstscreen-v10-evidence-verification.json
          if-no-files-found: error
          retention-days: 30

  native-compile:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    needs: desktop-web
    defaults:
      run: {working-directory: butler-desktop}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {ref: '${{ env.PR_HEAD_SHA }}', fetch-depth: 0}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: {node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: butler-desktop/package-lock.json, package-manager-cache: true}
      - run: npm ci
      - name: Enforce native trust authority and least privilege
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(grep -R -n --fixed-strings '/usr/bin/security' src-tauri/src || true)"
          test -z "$(grep -R -n --fixed-strings 'persist_runtime_trust_receipt' src src-tauri/src || true)"
          python - <<'PY'
          import json
          from pathlib import Path
          capability = json.loads(Path('src-tauri/capabilities/firstscreen-trust.json').read_text())
          assert capability['windows'] == ['main']
          assert 'remote' not in capability
          assert capability['permissions'] == [
              'allow-get-runtime-trust-status',
              'allow-verify-and-commit-trust-update',
          ]
          default = json.loads(Path('src-tauri/capabilities/default.json').read_text())
          assert 'shell:default' not in default['permissions']
          PY
      - run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component clippy,rustfmt
      - name: Prepare compile-only bundled resource paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/python-runtime src-tauri/models src-tauri/binaries
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$host"
          extension=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then extension=".exe"; fi
          touch "src-tauri/binaries/butler-sidecar-${host}${extension}"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  repository-python:
    runs-on: ubuntu-latest
    needs: scope-and-contracts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {ref: '${{ env.PR_HEAD_SHA }}', fetch-depth: 0}
      - name: Prepare isolated repository test state
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "${RUNNER_TEMP}/home" "${RUNNER_TEMP}/butler-app-data"
          {
            echo "HOME=${RUNNER_TEMP}/home"
            echo "BUTLER_APP_DATA_DIR=${RUNNER_TEMP}/butler-app-data"
          } >> "${GITHUB_ENV}"
      - name: Verify isolated repository test state
        shell: bash
        run: |
          set -euo pipefail
          test "${HOME}" = "${RUNNER_TEMP}/home"
          test "${BUTLER_APP_DATA_DIR}" = "${RUNNER_TEMP}/butler-app-data"
          test "$(stat -c '%a' "${HOME}")" = "700"
          test "$(stat -c '%a' "${BUTLER_APP_DATA_DIR}")" = "700"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-firstscreen-ci.lock
      - run: python -m pip install --require-hashes -r requirements-firstscreen-ci.lock
      - run: python -m pytest tests/ --collect-only -qq --ignore=tests/turboq/ --ignore=tests/eval/test_eval_hardcase.py --ignore=tests/eval/test_eval_judge_v3.py
      - run: python -m pytest tests/ -q --ignore=tests/turboq/ --ignore=tests/eval/test_eval_hardcase.py --ignore=tests/eval/test_eval_judge_v3.py --junitxml=repository-junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: {name: firstscreen-v2-5-repository, path: repository-junit.xml, if-no-files-found: error, retention-days: 30}

  # 인계 권한복구 스크립트는 macOS 전용 운영 스크립트다. 회귀가 ubuntu job 에서만 돌면
  # macOS 전용 경로(plutil 분기)가 CI 에서 한 번도 실행되지 않는다. 실제 대상 OS 에서 돌린다.
  handoff-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {ref: '${{ env.PR_HEAD_SHA }}', fetch-depth: 0}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-handoff-ci.lock
      - name: Assert macOS manifest validator is present
        run: command -v plutil
      - run: python -m pip install --require-hashes -r requirements-handoff-ci.lock
      - name: Run handoff permission regression on macOS
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_handoff_restore_permissions.py \
            --junitxml=handoff-macos-junit.xml
      - name: Assert every case ran (no skips)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ElementTree

          suite = ElementTree.parse("handoff-macos-junit.xml").getroot()
          if suite.tag == "testsuites":
              suite = suite.find("testsuite")
          total = int(suite.get("tests", "0"))
          skipped = int(suite.get("skipped", "0"))
          failures = int(suite.get("failures", "0"))
          errors = int(suite.get("errors", "0"))
          passed = total - skipped - failures - errors
          print(f"HANDOFF_MACOS tests={total} passed={passed} skipped={skipped} "
                f"failures={failures} errors={errors}")
          # macOS 전용 경로가 실제로 실행됐음을 보증한다. skip 은 실행되지 않은 것과 같다.
          problems = []
          if failures or errors:
              problems.append("failing cases")
          if skipped:
              problems.append("skipped cases")
          if total < 40:
              problems.append(f"expected at least 40 cases, got {total}")
          if problems:
              sys.exit("HANDOFF_MACOS_GATE_FAILED: " + ", ".join(problems))
          print("HANDOFF_MACOS_GATE_OK=1")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firstscreen-v2-5-handoff-macos
          path: handoff-macos-junit.xml
          if-no-files-found: error
          retention-days: 30

  gate:
    if: always()
    runs-on: ubuntu-latest
    needs: [scope-and-contracts, desktop-web, firstscreen-unit, firstscreen-learning-backend, firstscreen-browser-gates, firstscreen-required-node-audit, firstscreen-evidence-package, native-compile, repository-python, handoff-macos]
    steps:
      - name: Enforce event-applicable gates
        env:
          CONTRACTS: ${{ needs.scope-and-contracts.result }}
          WEB: ${{ needs.desktop-web.result }}
          FIRSTSCREEN_UNIT: ${{ needs.firstscreen-unit.result }}
          FIRSTSCREEN_LEARNING_BACKEND: ${{ needs.firstscreen-learning-backend.result }}
          FIRSTSCREEN_BROWSER: ${{ needs.firstscreen-browser-gates.result }}
          FIRSTSCREEN_NODE_AUDIT: ${{ needs.firstscreen-required-node-audit.result }}
          FIRSTSCREEN_EVIDENCE: ${{ needs.firstscreen-evidence-package.result }}
          NATIVE: ${{ needs.native-compile.result }}
          REPOSITORY: ${{ needs.repository-python.result }}
          HANDOFF_MACOS: ${{ needs.handoff-macos.result }}
        run: |
          test "${CONTRACTS}" = success
          test "${WEB}" = success
          test "${FIRSTSCREEN_UNIT}" = success
          test "${FIRSTSCREEN_LEARNING_BACKEND}" = success
          test "${FIRSTSCREEN_BROWSER}" = success
          test "${FIRSTSCREEN_NODE_AUDIT}" = success
          test "${FIRSTSCREEN_EVIDENCE}" = success
          test "${NATIVE}" = success
          test "${REPOSITORY}" = success
          test "${HANDOFF_MACOS}" = success
