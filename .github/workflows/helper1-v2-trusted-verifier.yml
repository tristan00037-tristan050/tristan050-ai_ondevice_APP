name: helper1-v2-trusted-verifier

on:
  workflow_run:
    workflows: [helper1-v2-evidence-producer]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read

concurrency:
  group: helper1-v2-trusted-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  protected-verdict:
    name: helper1-v2-protected-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: helper1-production-verifier
    steps:
      - name: Check out protected default-branch verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up protected Python runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked verifier dependencies
        run: python -m pip install --require-hashes -r requirements-firstscreen-ci.lock
      - name: Run protected trust-root regressions
        id: regressions
        continue-on-error: true
        run: |
          python -m pytest -q \
            tests/helper1_v2/test_self_selected_trust_regression.py \
            tests/helper1_v2/test_protected_workflow_topology.py
      - name: Exercise protected PostgreSQL replay reservation
        id: replay-store-probe
        continue-on-error: true
        env:
          HELPER1_APPROVAL_REPLAY_DSN: ${{ secrets.HELPER1_APPROVAL_REPLAY_DSN }}
          HELPER1_REPLAY_PROBE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python scripts/ci/helper1_postgresql_replay_probe.py
      - name: Download, but never execute, the producer artifact
        id: download-evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          install -d -m 0700 "${RUNNER_TEMP}/helper1/input"
          gh run download "${PRODUCER_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "helper1-v2-evidence-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}" \
            --dir "${RUNNER_TEMP}/helper1/input"
      - name: Recompute canonical subject and fetch exact Git object without checkout
        id: fetch-subject
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

      - name: Verify with protected policy and issue signed verdict
        id: verify-evidence
        if: always()
        continue-on-error: true
        env:
          HELPER1_VERDICT_SIGNING_KEY_B64: ${{ secrets.HELPER1_VERDICT_SIGNING_KEY_B64 }}
          HELPER1_APPROVAL_REPLAY_DSN: ${{ secrets.HELPER1_APPROVAL_REPLAY_DSN }}
        run: |
          set -euo pipefail
          python scripts/ci/helper1_trusted_verifier.py \
            --event "${GITHUB_EVENT_PATH}" \

            --output "${RUNNER_TEMP}/helper1/TRUSTED_VERDICT.json" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Preserve immutable subject-bound verdict
        id: preserve-verdict
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helper1-v2-protected-verdict-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/helper1/TRUSTED_VERDICT.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish fixed check on exact subject SHA
        id: publish-subject-check
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HELPER1_REGRESSION_OUTCOME: ${{ steps.regressions.outcome }}
          HELPER1_REPLAY_PROBE_OUTCOME: ${{ steps.replay-store-probe.outcome }}
          HELPER1_FETCH_OUTCOME: ${{ steps.fetch-subject.outcome }}
          HELPER1_DOWNLOAD_OUTCOME: ${{ steps.download-evidence.outcome }}
          HELPER1_VERIFY_OUTCOME: ${{ steps.verify-evidence.outcome }}
          HELPER1_PRESERVE_OUTCOME: ${{ steps.preserve-verdict.outcome }}
        run: |
          set -euo pipefail
          python scripts/ci/publish_helper1_subject_check.py \
            --event "${GITHUB_EVENT_PATH}" \
            --verdict "${RUNNER_TEMP}/helper1/TRUSTED_VERDICT.json" \
            --record "${RUNNER_TEMP}/helper1/SUBJECT_CHECK_PUBLICATION.json" \
            --publish | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Preserve subject-check publication record
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helper1-v2-subject-check-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/helper1/SUBJECT_CHECK_PUBLICATION.json
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce protected subject gate
        if: always()
        env:
          REGRESSION_OUTCOME: ${{ steps.regressions.outcome }}
          REPLAY_PROBE_OUTCOME: ${{ steps.replay-store-probe.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch-subject.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download-evidence.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify-evidence.outcome }}
          PRESERVE_OUTCOME: ${{ steps.preserve-verdict.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish-subject-check.outcome }}
        run: |
          set -euo pipefail
          for outcome in "${REGRESSION_OUTCOME}" "${REPLAY_PROBE_OUTCOME}" "${FETCH_OUTCOME}" "${DOWNLOAD_OUTCOME}" "${VERIFY_OUTCOME}" "${PRESERVE_OUTCOME}" "${PUBLISH_OUTCOME}"; do
            test "${outcome}" = success || { echo "PROTECTED_SUBJECT_GATE=0"; echo "ERROR_CODE=PROTECTED_GATE_PREREQUISITE_FAILED"; exit 1; }
          done
          echo "PROTECTED_SUBJECT_GATE=1"
          echo "ERROR_CODE=NONE"
