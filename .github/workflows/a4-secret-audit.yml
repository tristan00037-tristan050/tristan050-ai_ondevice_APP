name: A4 Secret Full-Repository Audit

# Full-repository (all branches) secret audit. This is deliberately SEPARATE
# from the per-PR merge gate in box5-stage3.yml:
#   * box5-stage3.yml scans `--history-scope head` — only what a PR would merge,
#     so unrelated branches can never block a PR (deterministic gate).
#   * this workflow scans `--history-scope all` on a schedule — a repo-wide net
#     that surfaces secret-like material anywhere in history for triage. It is
#     informational and is NOT a required status check on any pull request.

on:
  schedule:
    - cron: '17 3 * * 1'  # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  full-history-audit:
    name: Full-repository secret audit (all branches)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: a4-baseline-approval
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Fetch every branch for the repo-wide audit
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Full-repository (all branches) secret audit
        env:
          # Same pinned rotation-evidence verification as the PR gate.
          A4_ROTATION_EVIDENCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          A4_BASELINE_APPROVER_FINGERPRINT: ${{ vars.A4_BASELINE_APPROVER_FINGERPRINT }}
        run: |
          python scripts/ci/a4_repository_secret_scan.py \
            --repo . \
            --history-scope all \
            --baseline docs/ops/A4_V55_SECRET_SCAN_BASELINE.json \
            --baseline-manifest docs/ops/A4_V55_SECRET_SCAN_BASELINE_MANIFEST.json \
            --baseline-manifest-signature docs/ops/A4_V55_SECRET_SCAN_BASELINE_MANIFEST.json.sig \
            --rotation-status docs/ops/A4_V55_SECRET_ROTATION_STATUS.json \
            --report a4-secret-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: a4-secret-audit
          path: a4-secret-audit.json
