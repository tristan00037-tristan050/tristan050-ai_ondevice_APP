name: box2-helper3-v2-contract

on:
  pull_request:
    paths:
      - "butler_pc_core/cards/box2/**"
      - "tests/cards/box2/**"
      - "evidence/box2_helper3/**"
      - "data/box2_helper3_eval/**"
      - "requirements-box2-helper3.txt"
      - "install_runtime.sh"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Box 2 Helper 3 v2 contract tests
        run: |
          python -m pip install -U pip pytest
          python -m pytest -q tests/cards/box2
          python scripts/run_box2_helper3_v2_preflight.py
