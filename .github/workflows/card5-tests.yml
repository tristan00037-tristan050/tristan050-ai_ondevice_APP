name: Card 5 Tests

on:
  pull_request:
    paths:
      - 'src/butler/card5/**'
      - 'tests/card5/**'
      - 'evidence/accounting27/account_title_allowlist_47.json'
      - '.github/workflows/card5-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/butler/card5/**'
      - 'tests/card5/**'
      - 'evidence/accounting27/account_title_allowlist_47.json'
      - '.github/workflows/card5-tests.yml'

jobs:
  card5-pytest:
    name: Card 5 pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify card5 source and tests
        run: |
          test -d src/butler/card5 || { echo "BLOCK: src/butler/card5 not found"; exit 2; }
          test -d tests/card5 || { echo "BLOCK: tests/card5 not found"; exit 2; }
          test -f tests/card5/conftest.py || { echo "BLOCK: tests/card5/conftest.py not found"; exit 2; }
          find src/butler/card5 -maxdepth 2 -type f | sort
          find tests/card5 -maxdepth 2 -type f | sort

      - name: Compile card5 modules
        env:
          PYTHONPATH: src
        run: |
          python -m compileall src/butler/card5 tests/card5

      - name: Run card5 pytest
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/card5 -v --tb=short
