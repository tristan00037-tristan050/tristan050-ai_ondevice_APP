name: Box5 AC-25 Stage A Smoke

# §4-1 단계 A smoke — PR #904 후보 코드의 ★자기시험★ 이다.
#
# ★AC-25 독립검증이 아니다. 이 워크플로가 초록이어도 단계 B 판정이 아니다.
# ★secret 0 · environment 0 · checks:write 0 · PR #903 checkout 0
#
# 존재 이유(회고 D-3): 두 레인이 없는 파일을 설치 대상으로 부르는데도 CI 57개가
# 전부 초록이었다. 다른 job 이 먼저 해시 고정 lock 을 깔아 두어 우연히 넘어간
# 것이다. 그래서 ★단계 B 와 같은 명령을 병합 전에 한 번 실제로 돌려 본다.
#
# ★이 파일은 설치·검사 명령 문자열을 직접 조립하지 않는다. 보호 runner 가 만든다.
#
# ★action 은 전부 full commit SHA 로 고정한다.
on:
  pull_request:
    paths:
      - .github/workflows/box5-ac25-*.yml
      - scripts/ci/ac25/**
      - tests/box5_ac25/**

permissions:
  contents: read

concurrency:
  group: box5-ac25-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ac25-stage-b-smoke:
    name: ac25-stage-b-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      # actions/checkout v4 — 커밋 고정
      - name: Checkout candidate at exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # §5-2 — lock 은 Python 3.12 로 만들어졌다. 러너 기본 Python 을 쓰지 않는다.
      # actions/setup-python v5 — 커밋 고정
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # ★입력을 셸 본문에 넣지 않는다(M-4). env 로 넘긴 뒤 인용해 쓴다.
      - name: Assert exact PR head and Python version
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}" \
            || { echo "ERROR_CODE=SMOKE_HEAD_MISMATCH"; exit 1; }
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version' \
            || { echo "ERROR_CODE=SMOKE_PYTHON_VERSION_MISMATCH"; exit 1; }

      # ★단계 B 와 ★같은 진입점★ 이다. 설치·검사 명령은 보호 runner 안에 있다.
      - name: Resolve manifest, install, and self-test via protected runner
        id: runner
        env:
          PYTHONPATH: scripts/ci
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          python3 -m ac25.stage_b_runner \
            --trusted-root "${PWD}" \
            --worktree "${PWD}" \
            --mode smoke

      # runner 가 남긴 meta-only 요약만 읽는다. 원문·경로를 출력하지 않는다(§9).
      - name: Report meta-only test evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "ac25-selftest.json").read_text()
          )
          for key in ("tests_total", "tests_passed", "tests_failed",
                      "tests_skipped", "junit_sha256"):
              print(f"{key.upper()}={summary[key]}")
          PY

      # §12 는 이 job 에서 저장소 계약 스크립트를 돌리라고 정한다.
      # ★돌리지 못했다 — NOT_RUN 이다. 통과로 적지 않는다. 사유는 전부 원격 실측이다.
      #
      # ① 그 스크립트 이름이 워크플로 원문에 있으면 저장소 guard 가 이 파일을
      #    "full-history 워크플로" 로 자동 분류하고 checkout-depth SSOT 등록을 강제한다.
      # ② 그 SSOT 를 고치면 ssot registry consumer bind v1 이
      #    SSOT_CHANGED_WITHOUT_BOUND_CONSUMER_CHANGE 로 닫는다. 풀려면 bound
      #    consumer 인 guard 스크립트를 고쳐야 하는데, §3 허용 밖이고 §17 이 금지한다.
      # ③ 이 job 은 검사를 먼저 돌리므로 캐시가 남고, 그 뒤 계약을 돌리면
      #    NO_RAW_IN_LOGS_EXCEPTIONS_V1 이 닫힌다(원격 실측).
      #
      # 같은 계약은 이미 required job `product-verify-repo-guards` 가 ★같은 PR head★
      # 에서 돌린다. 여기서 중복 실행하려면 위 세 계약을 건드려야 한다. 총괄 판단 대기.
      - name: Repository contracts (delegated)
        run: |
          set -euo pipefail
          echo "REPO_CONTRACTS_IN_SMOKE=NOT_RUN"
          echo "REPO_CONTRACTS_DELEGATED_TO=product-verify-repo-guards"

      - name: Clean finish (tracked and untracked)
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR_CODE=SMOKE_WORKTREE_NOT_CLEAN"
            git status --porcelain
            exit 1
          fi
