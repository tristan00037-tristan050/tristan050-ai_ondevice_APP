name: Box5 AC-25 Stage A Smoke

# §18 단계 A smoke — PR #904 후보 코드의 ★무권한 자기시험★ 이다.
#
# ★AC-25 독립 승인으로 부르지 않는다. 이 워크플로가 초록이어도 단계 B 판정이 아니다.
# ★secret 0 · environment 0 · checks:write 0 · PR #903 checkout 0
# ★action 은 전부 full commit SHA 로 고정한다.
# ★설치·검사 명령 문자열을 이 파일에서 조립하지 않는다. 보호 runner 가 만든다.
# ★R6-2 — 기대 좌표를 이 파일에 적지 않는다. 보호된 단일 원본에서만 온다.
# ★R6-4 — 저장소 계약은 exact PR head 에서, 실제 빌드 산출물·Helm 을 준비한 뒤
#   raw 출력을 격리한 상태로 정확히 한 번 돈다.
#
# 신뢰 경계(§8 정정): 후보 ★제품 코드·빌드 스크립트·제품 테스트는 실행하지 않는다.
# 다만 PR #904 의 ac25 verifier Python 코드는 이 비특권 job 에서 ★실행한다.
# "후보 코드를 전혀 실행하지 않는다" 고 쓰면 사실이 아니다.
on:
  pull_request:
    paths:
      - .github/workflows/box5-ac25-*.yml
      - scripts/ci/ac25/**
      - tests/box5_ac25/**

permissions: {}

concurrency:
  group: box5-ac25-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ══ 검증기 자기시험 ═══════════════════════════════════════════════════
  ac25-stage-b-smoke:
    name: ac25-stage-b-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout candidate at exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # ★입력을 셸 본문에 넣지 않는다(M-4). env 로 넘긴 뒤 인용해 쓴다.
      - name: Assert exact PR head and Python version
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}" \
            || { echo "ERROR_CODE=SMOKE_HEAD_MISMATCH"; exit 1; }
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version' \
            || { echo "ERROR_CODE=SMOKE_PYTHON_VERSION_MISMATCH"; exit 1; }

      # ★단계 B 와 ★같은 진입점★ 이다. 설치·검사 명령은 보호 runner 안에 있다.
      - name: Resolve manifest, install, and self-test via protected runner
        env:
          PYTHONPATH: scripts/ci
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          python3 -m ac25.stage_b_runner \
            --trusted-root "${PWD}" \
            --worktree "${PWD}" \
            --mode smoke

      # runner 가 남긴 meta-only 요약만 읽는다. 원문·경로를 출력하지 않는다(§9).
      - name: Report meta-only test evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "ac25-selftest.json").read_text()
          )
          for key in ("tests_total", "tests_passed", "tests_failed",
                      "tests_skipped", "junit_sha256"):
              print(f"{key.upper()}={summary[key]}")
          PY

      - name: Verify erratum 2 and external evidence root
        env:
          EXPECTED_ERRATUM_SHA256: 2ed584f139227a454c821729c44586fd628d8f0239b61700fae62cc7d7c185db
        run: |
          set -euo pipefail
          test "$(sha256sum docs/box5/ac25/ac25-r6-erratum-2.json | cut -d' ' -f1)" = "${EXPECTED_ERRATUM_SHA256}" \
            || { echo "ERROR_CODE=ERRATUM_2_DIGEST_MISMATCH"; exit 1; }
          case "${RUNNER_TEMP}" in
            "${GITHUB_WORKSPACE}"|"${GITHUB_WORKSPACE}"/*)
              echo "ERROR_CODE=OUTPUT_ROOT_POLICY_VIOLATION"
              exit 1
              ;;
          esac

      # §18 — 최종 상태의 원시 NUL 바이트는 저장소 밖에 남기고,
      # dirty 면 경로 목록을 로그에 내지 않는다. 코드만 낸다.
      - name: Clean finish (tracked and untracked)
        run: |
          set -euo pipefail
          clean_status="${RUNNER_TEMP}/ac25-clean-status.porcelain-v2.z"
          git status --porcelain=v2 -z --untracked-files=all > "${clean_status}" \
            || { echo "ERROR_CODE=SMOKE_CLEAN_CHECK_FAILED"; exit 1; }
          if ! git diff --quiet || ! git diff --cached --quiet \
             || [ -s "${clean_status}" ]; then
            echo "ERROR_CODE=SMOKE_WORKTREE_NOT_CLEAN"
            exit 1
          fi

      - name: Bind Python evidence to exact run attempt and job
        id: python_artifact
        env:
          PYTHONPATH: scripts/ci
          PYTHONNOUSERSITE: '1'
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          AC25_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -S -m ac25.candidate_artifact_v44 \
            --logical-id ac25-v44-python \
            --job-name ac25-stage-b-smoke \
            --output "${RUNNER_TEMP}/payload-manifest.json" \
            --file junit.xml="${RUNNER_TEMP}/ac25-junit.xml" \
            --file selftest.json="${RUNNER_TEMP}/ac25-selftest.json" \
            --file clean-status.porcelain-v2.z="${RUNNER_TEMP}/ac25-clean-status.porcelain-v2.z"

      - name: Upload raw Python acceptance evidence
        id: upload_python_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.python_artifact.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/ac25-junit.xml
            ${{ runner.temp }}/ac25-selftest.json
            ${{ runner.temp }}/ac25-clean-status.porcelain-v2.z
            ${{ runner.temp }}/payload-manifest.json
          if-no-files-found: error
          retention-days: 14

  # ══ C2 — Ubuntu 원격 재현 (좌표는 단일 원본에서만 온다) ═══════════════
  ac25-merge-reproducibility:
    name: ac25-merge-reproducibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout candidate at exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Resolve stage-B coordinates from the protected single source
        id: coordinates
        env:
          PYTHONPATH: scripts/ci
          PYTHONNOUSERSITE: '1'
        run: python3 -m ac25.stage_b_coordinates --emit-github-output

      - name: Fetch approved base and candidate objects
        env:
          INTEGRATION_BASE: ${{ steps.coordinates.outputs.integration_base }}
          CANDIDATE_HEAD: ${{ steps.coordinates.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${INTEGRATION_BASE}" "${CANDIDATE_HEAD}"

      # ★두 번 합성해 서로 같고 단일 원본 좌표와도 같은지 본다.
      # ★다른 값이 나와도 상수를 고쳐 맞추지 않는다.
      - name: Synthesize twice and compare with the single-source coordinates
        env:
          PYTHONPATH: scripts/ci
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          echo "C2_GIT_VERSION=$(git --version)"
          echo "C2_RUNNER_IMAGE_OS=${ImageOS:-unknown}/${ImageVersion:-unknown}"
          python3 - <<'PY'
          import tempfile
          from pathlib import Path

          from ac25 import stage_b_coordinates
          from ac25.integration_merge import build_synthetic_merge, cleanup_worktree

          repository = Path.cwd()
          expected = stage_b_coordinates.load_trusted_coordinates(repository).stage_b

          runs = []
          for index in (1, 2):
              root = Path(tempfile.mkdtemp(prefix=f"ac25-c2-{index}-"))
              destination = root / "worktree"
              try:
                  merge = build_synthetic_merge(
                      repository=repository,
                      destination=destination,
                      integration_base_commit=expected.integration_base,
                      candidate_head=expected.candidate_commit,
                  )
                  runs.append(
                      (merge.synthetic_merge_commit, merge.merge_tree, merge.parents)
                  )
              finally:
                  cleanup_worktree(repository, destination, raise_on_failure=False)

          # ★전체 OID 를 로그에 반복하지 않는다. 짧은 표시만 낸다(§5-2).
          for index, (commit, tree, parents) in enumerate(runs, start=1):
              print(f"C2_RUN_{index}_COMMIT_SHORT={commit[:8]}")
              print(f"C2_RUN_{index}_TREE_SHORT={tree[:8]}")

          if runs[0] != runs[1]:
              print("ERROR_CODE=INTEGRATION_MERGE_NOT_REPRODUCIBLE")
              raise SystemExit(1)

          commit, tree, parents = runs[0]
          codes = stage_b_coordinates.evaluate_observed(
              candidate_commit=expected.candidate_commit,
              candidate_tree=expected.candidate_tree,
              integration_base=expected.integration_base,
              merge_commit=commit,
              merge_tree=tree,
              merge_parents=list(parents),
              expected=expected,
          )
          print(f"C2_MATCHES_EXPECTED={'YES' if not codes else 'NO'}")
          if codes:
              print(f"ERROR_CODE={codes[0]}")
              raise SystemExit(1)
          print("VERDICT=1")
          print("ERROR_CODE=OK")
          PY

  # ══ C3 — 실행 가능한 발행 시험 ════════════════════════════════════════
  ac25-publish-check-executable-test:
    name: ac25-publish-check-executable-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout candidate at exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      # ★정적 문자열 검색이 아니라 ★실제 실행★ 이다. Checks API 를 mock 한다.
      - name: Run publish_check executable tests
        run: |
          set -euo pipefail
          node --test tests/box5_ac25/publish_check.test.mjs
          node --test --test-reporter=tap tests/box5_ac25/publish_check.test.mjs \
            > "${RUNNER_TEMP}/ac25-publish.tap"

      - name: Bind Node evidence to exact run attempt and job
        id: node_artifact
        env:
          PYTHONPATH: scripts/ci
          PYTHONNOUSERSITE: '1'
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          AC25_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -S -m ac25.candidate_artifact_v44 \
            --logical-id ac25-v44-node \
            --job-name ac25-publish-check-executable-test \
            --output "${RUNNER_TEMP}/payload-manifest.json" \
            --file publish.tap="${RUNNER_TEMP}/ac25-publish.tap"

      - name: Upload raw Node acceptance evidence
        id: upload_node_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.node_artifact.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/ac25-publish.tap
            ${{ runner.temp }}/payload-manifest.json
          if-no-files-found: error
          retention-days: 14

  # ══ R6-4 — exact head 저장소 계약 (v3.1 §3) ═══════════════════════════
  # 준비 = canonical 추출 그대로(추가 명령 0). action 도 canonical 과 같은
  # 두 family(checkout·setup-node)뿐이다 — Python 은 runner 이미지의 시스템
  # python3(3.12) 를 그대로 쓴다. 허용 차이는 §3-3 의 셋뿐이고, runner 가
  # 이 파일을 실행 시점에 읽어 canonical 과 완전 비교한다. 어긋나면 계약을
  # 실행하지 않는다.
  ac25-repo-contracts-exact-head:
    name: ac25-repo-contracts-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout candidate at exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      # ★이 job 의 유일한 run — 승인된 harness 하나다(§3-5). 준비를 이 파일
      #   에서 조립하거나 다른 이름으로 되살리면 runner 의 EXTRA 축이 잡는다.
      - name: Prepare toolchain and run repository contracts exactly once
        env:
          PYTHONPATH: scripts/ci
          PYTHONNOUSERSITE: '1'
          # ★harness 가 scripts/ 아래에 __pycache__/*.pyc 를 만들면, 계약의
          #   long-line guard(P5-PLAT-P0-05)가 그 .pyc 에서 BLOCK 한다 —
          #   여섯 라운드 실패의 실증된 원인. 지우는 게 아니라 ★안 만든다★.
          PYTHONDONTWRITEBYTECODE: '1'
          AC25_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AC25_BASE_REF: ${{ github.event.pull_request.base.sha }}
          AC25_CONTRACT_EVIDENCE_ROOT: ${{ runner.temp }}/ac25-v44-contract
          AC25_EVIDENCE_ROOT: ${{ runner.temp }}/ac25-v44-contract
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          set -euo pipefail
          python3 -S -m ac25.repo_contract_runner
