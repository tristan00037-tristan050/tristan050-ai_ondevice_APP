name: model-path-contract

on:
  pull_request:
    paths:
      - "butler-desktop/src-tauri/src/lib.rs"
      - "butler_pc_core/inference/model_identity.py"
      - "butler_sidecar.py"
      - "scripts/verify_model_path_contract.py"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify free-chat/box3 model path role separation
        run: |
          python3 scripts/verify_model_path_contract.py .
