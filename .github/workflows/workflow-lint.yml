name: workflow-lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/ops/**"
      - "scripts/verify/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-firstscreen-ci.lock

      - name: Install required YAML parser
        run: python -m pip install --require-hashes -r requirements-firstscreen-ci.lock

      - name: Install checksum-pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          bindir="${RUNNER_TEMP}/actionlint-bin"
          install -d -m 0700 "${bindir}"
          curl --fail --show-error --silent --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "${ACTIONLINT_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          tar --no-same-owner -xzf "${archive}" -C "${bindir}" actionlint
          test "$("${bindir}/actionlint" -version | head -n 1)" = "${ACTIONLINT_VERSION}"
          echo "${bindir}" >> "${GITHUB_PATH}"

      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ops/verify_workflow_lint.sh
