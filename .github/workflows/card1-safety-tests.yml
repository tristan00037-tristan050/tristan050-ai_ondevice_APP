name: Card 1 Safety Tests

on:
  pull_request:
    paths:
      - 'src/butler/card1/safety/**'
      - 'data/card1/card1_allowlist.json'
      - 'tests/card1/**'
      - 'evidence/card1/card1_safety_evidence.json'
      - '.github/workflows/card1-safety-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/butler/card1/safety/**'
      - 'data/card1/card1_allowlist.json'
      - 'tests/card1/**'
      - 'evidence/card1/card1_safety_evidence.json'
      - '.github/workflows/card1-safety-tests.yml'

jobs:
  card1-safety-pytest:
    name: Card 1 safety pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify card1 safety files
        run: |
          test -d src/butler/card1/safety || { echo "BLOCK: src/butler/card1/safety not found"; exit 2; }
          test -f data/card1/card1_allowlist.json || { echo "BLOCK: data/card1/card1_allowlist.json not found"; exit 2; }
          test -d tests/card1 || { echo "BLOCK: tests/card1 not found"; exit 2; }
          find src/butler/card1/safety -maxdepth 2 -type f | sort
          find tests/card1 -maxdepth 2 -type f | sort

      - name: Compile card1 safety modules
        env:
          PYTHONPATH: .
        run: |
          python -m compileall src/butler/card1/safety tests/card1

      - name: Run card1 safety pytest
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/card1 -v --tb=short
