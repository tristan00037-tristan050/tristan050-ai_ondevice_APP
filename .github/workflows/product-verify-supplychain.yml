# PREP_TOKEN=1
name: product-verify-supplychain

on:
  pull_request: {}
  merge_group: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify_slsa_provenance_min:
    name: verify-slsa-provenance-min
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Preflight v1
        uses: ./.github/actions/preflight_v1

      - name: Create minimal provenance (file)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          node <<'NODE'
          const fs = require('fs');
          const repo = process.env.GITHUB_REPOSITORY || '';
          const sha = process.env.GITHUB_SHA || '';
          const runId = process.env.GITHUB_RUN_ID || '';
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${repo}/actions/runs/${runId}`;
          const now = new Date();
          const started = new Date(now.getTime() - 1000).toISOString();
          const finished = now.toISOString();
          const out = {
            _type: "https://in-toto.io/Statement/v1",
            subject: [
              {
                name: "repo",
                digest: {
                  sha256: sha ? sha.padStart(64, '0').slice(0, 64) : "0".repeat(64)
                }
              }
            ],
            predicateType: "https://slsa.dev/provenance/v1",
            predicate: {
              buildType: "https://github.com/actions/workflow",
              builder: { id: "github-actions" },
              invocation: {
                parameters: { repo, sha, run_id: runId, run_url: runUrl }
              },
              metadata: { buildStartedOn: started, buildFinishedOn: finished },
              materials: [
                {
                  uri: `git+https://github.com/${repo}@${sha}`,
                  digest: { sha256: sha ? sha.padStart(64, '0').slice(0, 64) : "0".repeat(64) }
                }
              ]
            }
          };
          fs.writeFileSync(".artifacts/slsa_provenance_min.json", JSON.stringify(out));
          NODE

      - name: Verify SLSA provenance min (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify/verify_slsa_provenance_min.sh

      - name: Generate model pack SBOM (CycloneDX)
        shell: bash
        run: bash scripts/ops/gen_model_pack_sbom_cyclonedx_v1.sh

      - name: Verify model pack SBOM cyclonedx v1
        shell: bash
        run: bash scripts/verify/verify_model_pack_sbom_cyclonedx_v1.sh
        env:
          MODEL_PACK_SBOM_ENFORCE: "1"
      - name: Generate TUF metadata skeleton v1
        shell: bash
        run: bash scripts/ops/gen_tuf_metadata_skeleton_v1.sh

      - name: Verify secure update TUF principles v1
        shell: bash
        run: bash scripts/verify/verify_secure_update_tuf_principles_v1.sh
        env:
          SECURE_UPDATE_TUF_ENFORCE: "1"
      - name: Upload provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: slsa_provenance_min
          path: .artifacts/slsa_provenance_min.json

  attest_dsse_provenance:
    name: attest-dsse-provenance
    runs-on: ubuntu-latest
    needs: [verify_slsa_provenance_min]
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Skip attestation on PR/merge_group (report OK, no network)
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "SKIP: attestation is main-only (to avoid PR/merge_group network flakiness)"

      - name: Setup Python for FirstScreen release subjects (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-firstscreen-ci.lock

      - name: Install hash-locked FirstScreen release dependencies (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: python -m pip install --require-hashes -r requirements-firstscreen-ci.lock

      - name: Prepare FirstScreen source and SBOM subjects (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/firstscreen-release"
          mkdir -p "${out}"
          python scripts/release/build_safe_source_archive.py --commit HEAD --scope-baseline HEAD^ --output "${out}/source.zip" --manifest "${out}/SOURCE_ARCHIVE_MANIFEST.json"
          # Regression guard (CI-gate): build_with_git.py enforces a clean working
          # tree. This step MUST run before any step that writes untracked build
          # outputs into the workspace (e.g. the bench-subject step's .artifacts/),
          # otherwise the clean check trips and surfaces as BUILD_CONTEXT_INVALID.
          # Assert the tree is clean at build_with_git time so an accidental
          # reordering fails loudly here instead of being swallowed downstream.
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "${dirty}" ]; then
            echo "TREE_NOT_CLEAN_BEFORE_BUILD_CONTEXT:"
            echo "${dirty}"
            exit 1
          fi
          python scripts/release/build_with_git.py --output "${out}/BUILD_CONTEXT.json" --source-manifest "${out}/SOURCE_ARCHIVE_MANIFEST.json" --repository "${GITHUB_REPOSITORY}" --workflow-identity "${GITHUB_WORKFLOW_REF}" --toolchain-identity "python=3.12;node=lock-only;rust=lock-only" --baseline HEAD^
          python scripts/release/generate_cyclonedx_sbom.py --commit HEAD --output "${out}/butler.cdx.json" --build-context "${out}/BUILD_CONTEXT.json" --npm-lock butler-desktop/package-lock.json --python-requirements requirements-firstscreen-ci.lock

      - name: Prepare deterministic bench release + subject for attestation (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          # P0-5 (PR861-F005): rebuild the deterministic model-tier-B bench release
          # payload from the committed tree and bind its digest to the DSSE subject,
          # instead of signing only generic repo/sha text.
          git archive --format=tar --prefix=bench-model-tier-b/ "${GITHUB_SHA}:bench/model_tier_b" \
            | gzip -n > .artifacts/bench_model_tier_b_release.tar.gz
          RELEASE_SHA="$(sha256sum .artifacts/bench_model_tier_b_release.tar.gz | cut -d' ' -f1)"
          {
            echo "repo=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT:-0}"
            echo "bench_model_tier_b_release_sha256=${RELEASE_SHA}"
          } > .artifacts/supplychain_subject.txt

      - name: Generate DSSE provenance attestation (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/attest-build-provenance@v3
        with:
          # Sign the deterministic bench release payload itself (subject 1) and the
          # subject manifest that records its digest (subject 2).
          subject-path: |
            .artifacts/bench_model_tier_b_release.tar.gz
            .artifacts/supplychain_subject.txt

      - name: Attest FirstScreen source with its CycloneDX SBOM (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/firstscreen-release/source.zip
          sbom-path: ${{ runner.temp }}/firstscreen-release/butler.cdx.json

      - name: Verify FirstScreen attestation signer and subject (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "${RUNNER_TEMP}/firstscreen-release/source.zip" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_WORKFLOW_REF%%@*}"

      - name: Install deps for verify (jq) (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Verify DSSE attestation (fail-closed) (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify/verify_slsa_dsse_attestation.sh

  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [verify_slsa_provenance_min, attest_dsse_provenance]
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: "Gate (PR/merge_group: provenance_min only, main: require DSSE)"
        shell: bash
        run: |
          set -euo pipefail
          echo "provenance_min=${{ needs.verify_slsa_provenance_min.result }}"
          echo "attest_dsse=${{ needs.attest_dsse_provenance.result }}"
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"

          if [ "${{ needs.verify_slsa_provenance_min.result }}" != "success" ]; then
            echo "GATE:FAIL (provenance_min)"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            if [ "${{ needs.attest_dsse_provenance.result }}" != "success" ]; then
              echo "GATE:FAIL (dsse required on main)"
              exit 1
            fi
          fi

          echo "GATE:OK"
