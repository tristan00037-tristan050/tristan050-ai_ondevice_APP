name: Box5 Stage3 Classify/Policy

permissions:
  contents: read

# F012 — locked CI for the stage-3 integration (Area A policy loader + Area B classifier +
# contract closure). Deterministic and model-free: journal/ledger/report (5·6단계) and the
# accounting model runtime are out of scope, so this gate runs only the stage-3 classify/policy
# suites. JOURNAL_AUTO_POST_ALLOWED stays NO; nothing here posts a journal.

on:
  pull_request:
    paths:
      - 'butler_pc_core/accounting/classify/**'
      - 'butler_pc_core/accounting/eval/**'
      - 'butler_pc_core/accounting/policy/**'
      # 이번 결합 본체(assignment suite + 제품 배선 + lock)를 게이트에 포함한다.
      - 'butler_pc_core/accounting/assignment/**'
      - 'butler_pc_core/a4_verifier/**'
      - 'butler_pc_core/accounting/ft_classifier.py'
      - 'butler_sidecar.py'
      - 'butler-desktop/src/lib/accounting_review/**'
      - 'butler-desktop/src/components/accounting_review/**'
      - 'tests/accounting/classify/**'
      - 'tests/accounting/policy/**'
      - 'tests/accounting/assignment/**'
      - 'tests/accounting/test_finetuned_accuracy.py'
      - 'tests/accounting/test_classifier.py'
      - 'scripts/write_build_info.py'
      - 'scripts/build_complete_app.sh'
      - 'scripts/build_a4_authority_helper_macos.sh'
      - 'scripts/ci/a4_*.py'
      - 'butler-desktop/src-tauri/native/a4_verifier_authority_launcher.swift'
      - 'butler-desktop/src-tauri/native/a4_secure_memory.swift'
      - 'butler-desktop/src-tauri/native/a4_authority_*.swift'
      - 'docs/ops/A4_V55_*.json'
      - 'docs/ops/A4_V55_*.md'
      - 'docs/ops/A4_V54_INTEGRATION_STATUS.json'
      - 'butler-desktop/src-tauri/src/lib.rs'
      - 'tests/accounting/test_cli.py'
      - 'tests/accounting/test_sse_phase_messages.py'
      - 'tests/company_policy/test_accounting_header_trust.py'
      - 'integration_lock.json'
      - '.github/workflows/box5-stage3.yml'
  push:
    branches: [main]
    paths:
      - 'butler_pc_core/accounting/classify/**'
      - 'butler_pc_core/accounting/eval/**'
      - 'butler_pc_core/accounting/policy/**'
      - 'butler_pc_core/accounting/assignment/**'
      - 'butler_pc_core/a4_verifier/**'
      - 'butler_pc_core/accounting/ft_classifier.py'
      - 'butler_sidecar.py'
      - 'butler-desktop/src/lib/accounting_review/**'
      - 'butler-desktop/src/components/accounting_review/**'
      - 'tests/accounting/classify/**'
      - 'tests/accounting/policy/**'
      - 'tests/accounting/assignment/**'
      - 'tests/accounting/test_finetuned_accuracy.py'
      - 'tests/accounting/test_classifier.py'
      - 'scripts/write_build_info.py'
      - 'scripts/build_complete_app.sh'
      - 'scripts/build_a4_authority_helper_macos.sh'
      - 'scripts/ci/a4_*.py'
      - 'butler-desktop/src-tauri/native/a4_verifier_authority_launcher.swift'
      - 'butler-desktop/src-tauri/native/a4_secure_memory.swift'
      - 'butler-desktop/src-tauri/native/a4_authority_*.swift'
      - 'docs/ops/A4_V55_*.json'
      - 'docs/ops/A4_V55_*.md'
      - 'docs/ops/A4_V54_INTEGRATION_STATUS.json'
      - 'butler-desktop/src-tauri/src/lib.rs'
      - 'tests/accounting/test_cli.py'
      - 'tests/accounting/test_sse_phase_messages.py'
      - 'tests/company_policy/test_accounting_header_trust.py'
      - 'integration_lock.json'
      - '.github/workflows/box5-stage3.yml'

jobs:
  stage3-suite:
    name: stage-3 classify + policy suite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install deps (model-free)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema cryptography pydantic fastapi==0.128.8 starlette==0.49.3 httpx python-multipart jinja2 pyyaml pandas openpyxl
      - name: Stage-3 policy assets invariants (registry-bound account_id / code null / lock)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json, pathlib
          bun = pathlib.Path("butler_pc_core/accounting/policy/bundles/atlink_smb_v2_1_draft")
          chart = json.loads((bun/"upstream/chart_of_accounts.atlink.v1.json").read_text())
          ov = json.loads((bun/"posting_policy_overlay.atlink.v1.4.json").read_text())
          accs = chart.get("accounts") or []
          ids = {a["account_id"] for a in accs}
          assert sum(1 for a in accs if a.get("code") is not None) == 0, "code non-null present"
          dec = ov.get("decisions") or []
          assert {d.get("account_id") for d in dec if d.get("account_id")} <= ids, "account_id outside registry"
          assert ov.get("status") == "BLOCKED_PENDING_FINANCE_APPROVAL", "overlay must stay finance-locked"
          print("POLICY_ASSET_INVARIANTS_OK=1  accounts=%d decisions=%d" % (len(accs), len(dec)))
          PY
      - name: Integration lock present + schema/base bound (공급망 재현성)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          test -f integration_lock.json || { echo "integration_lock.json MISSING in repo"; exit 1; }
          python - <<'PY'
          import json, jsonschema
          lock = json.load(open("integration_lock.json"))
          schema = json.load(open("butler_pc_core/accounting/assignment/contracts/integration_lock.schema.json"))
          jsonschema.Draft202012Validator(schema, format_checker=jsonschema.FormatChecker()).validate(lock)
          assert lock["base_commit"] == "55d0f315e2b375d58c9c2a0263b606e5a757b59e"
          assert lock["base_tree"]   == "9d21d32bca294bc9998253f7d1c2f6f88ad71114"
          print("INTEGRATION_LOCK_BOUND_OK=1")
          PY
      - name: Stage-3 classify + policy + assignment suite (green, model-free)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest \
            tests/accounting/classify \
            tests/accounting/policy \
            tests/accounting/assignment \
            tests/accounting/test_sse_phase_messages.py \
            tests/company_policy/test_accounting_header_trust.py \
            -q --tb=short --junitxml=stage3-junit.xml
      - name: Contract closure offline verifier (reason registry + decision receipt)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from butler_pc_core.accounting.classify.contracts import (
              registry_closure_digest, emit_reason, validate_decision_receipt, ReasonRegistryError)
          from butler_pc_core.accounting.classify.models import ReasonCode
          # F005 closure holds; F015 a contradictory receipt is rejected.
          assert len(registry_closure_digest()) == 64
          try:
              emit_reason("MADE_UP"); raise SystemExit("registry closure breached")
          except ReasonRegistryError:
              pass
          print("CONTRACT_CLOSURE_VERIFIER_OK=1")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stage3-junit
          path: stage3-junit.xml

  a4-canonical-product:
    name: A4 canonical product + independent verifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install product-path dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema cryptography pydantic fastapi==0.128.8 starlette==0.49.3 httpx python-multipart jinja2 pyyaml pandas openpyxl xlrd
      - name: Enforce one A4 closure and verifier authority
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from butler_pc_core.a4_verifier.cli import CODE_FILES
          from butler_pc_core.accounting.classify.reconciliation_service_v2 import CODE_CLOSURE_FILES
          from scripts.write_build_info import _A4_CODE_FILES

          root = Path.cwd()
          verifier = root / 'butler_pc_core/a4_verifier/cli.py'
          tree = ast.parse(verifier.read_text(encoding='utf-8'))
          imports = {
              alias.name
              for node in ast.walk(tree)
              if isinstance(node, ast.Import)
              for alias in node.names
          } | {
              (node.module or '')
              for node in ast.walk(tree)
              if isinstance(node, ast.ImportFrom)
          }
          assert not any(name.startswith('butler_pc_core.accounting') for name in imports)
          assert tuple(CODE_CLOSURE_FILES) == tuple(CODE_FILES) == tuple(_A4_CODE_FILES)
          assert len(list((root / 'butler_pc_core/a4_verifier').glob('cli.py'))) == 1
          assert len(list((root / 'butler_pc_core/accounting/classify/contracts').glob('**/verification_receipt.schema.json'))) == 1
          assert len(list((root / 'butler_pc_core/accounting/classify/contracts').glob('**/code_dictionary.production.json'))) == 1
          assert len(list((root / 'butler_pc_core/accounting/classify/contracts').glob('**/release_manifest.production.json'))) == 1
          print('A4_ONE_CANONICAL_AUTHORITY=1')
          PY
      - name: Accounting product and A4 attack suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          HOME: ${{ runner.temp }}/butler-home
        run: |
          python -m pytest \
            tests/accounting \
            tests/company_profile \
            tests/company_policy/test_accounting_header_trust.py \
            tests/test_write_build_info.py \
            -q --tb=short --junitxml=a4-canonical-junit.xml
      - name: Repository-wide ownership classification
        env:
          PYTHONPATH: ${{ github.workspace }}
          HOME: ${{ runner.temp }}/butler-home
        run: |
          set +e
          python -m pytest -q --tb=short --junitxml=a4-repo-wide-junit.xml
          pytest_exit_code=$?
          set -e
          python scripts/ci/classify_a4_repository_failures.py \
            --junit a4-repo-wide-junit.xml \
            --baseline docs/ops/A4_V55_REPOSITORY_FAILURE_BASELINE.json \
            --pytest-exit-code "$pytest_exit_code" \
            --report a4-repo-failure-classification.json
      - name: Clean repository closure
        run: |
          python - <<'PY'
          import re, subprocess
          tracked = subprocess.check_output(
              ['git', 'ls-files'], text=True
          ).splitlines()
          forbidden = re.compile(r'(^|/)(__pycache__|\.pytest_cache|\.mypy_cache)(/|$)|\.py[co]$|\.log$|(^|/)\.DS_Store$|(^|/)\.env(?:\.|$)|credentials?', re.I)
          errors = [f'FORBIDDEN_PATH:{name}' for name in tracked if forbidden.search(name)]
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'A4_V55_CLEAN_REPOSITORY_CLOSURE=1 tracked={len(tracked)}')
          PY
      - name: Full tracked and Git history secret scan
        run: |
          python scripts/ci/a4_repository_secret_scan.py \
            --repo . \
            --baseline docs/ops/A4_V55_SECRET_SCAN_BASELINE.json \
            --rotation-status docs/ops/A4_V55_SECRET_ROTATION_STATUS.json \
            --report a4-secret-scan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: a4-canonical-junit
          path: |
            a4-canonical-junit.xml
            a4-repo-wide-junit.xml
            a4-repo-failure-classification.json
            a4-secret-scan.json

  a4-native-contract:
    name: A4 native authority contract
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Typecheck the production XPC authority source set
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/AuthorityBuildConfig.swift" <<'SWIFT'
          let a4KeychainAccessGroup = "group.com.butler.a4.ci"
          let a4ExpectedCallerRequirement = "anchor apple generic"
          let a4ExpectedAuthorityRequirement = "anchor apple generic"
          let a4VerifierRequirement = "anchor apple generic"
          let a4XPCServiceName = "com.butler.a4-verifier-authority"
          SWIFT
          xcrun swiftc -typecheck -module-cache-path "$tmp/module-cache" \
            butler-desktop/src-tauri/native/a4_verifier_authority_launcher.swift \
            butler-desktop/src-tauri/native/a4_secure_memory.swift \
            butler-desktop/src-tauri/native/a4_authority_protocol.swift \
            butler-desktop/src-tauri/native/a4_authority_canonical.swift \
            butler-desktop/src-tauri/native/a4_authority_replay.swift \
            "$tmp/AuthorityBuildConfig.swift" \
            -framework Foundation -framework Security -framework CryptoKit -lsqlite3
          xcrun clang -O2 -fno-builtin-memset -c \
            butler-desktop/src-tauri/native/a4_secure_zero.c \
            -o "$tmp/a4_secure_zero.o"
          xcrun swiftc -module-cache-path "$tmp/test-module-cache" \
            butler-desktop/src-tauri/native/a4_secure_memory.swift \
            tests/accounting/classify/swift/a4_secure_memory_tests.swift \
            "$tmp/a4_secure_zero.o" -o "$tmp/a4-secure-memory-tests"
          "$tmp/a4-secure-memory-tests"
          bash -n scripts/build_a4_authority_helper_macos.sh
