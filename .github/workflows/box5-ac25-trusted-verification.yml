name: Box5 AC-25 Trusted Verification

# §10 보호된 워크플로. default branch(main) 에 병합된 뒤 workflow_dispatch 로만 돈다.
# 사용자 입력은 권위값이 아니라 보호된 lock 과 완전일치하는지 대조할 주장값이다.
#
# ★신뢰 검증의 유일한 진입점은 scripts/ci/ac25/orchestrator.py 다.
#   부품만 만들어 두고 워크플로가 부르지 않으면 검증은 없는 것과 같다.
# ★orchestrator 성공은 나머지 모든 job 의 필수 선행조건이다.
# ★publish-check 는 두 레인의 실제 검사 결과와 정확한 OID·digest 를 모두 받은
#   경우에만 성공 check-run 을 만든다.
# ★후보(PR #903)의 Python/JS/셸 코드는 candidate/integration 레인에서만 돈다.
#   그 레인들은 secrets 를 받지 않고 contents:read 만 갖는다.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 판정 대상 PR 번호(903 고정 대조)
        required: true
        type: string
      expected_head:
        description: 후보 head SHA(주장값 · lock 과 대조)
        required: true
        type: string
      expected_tree:
        description: 후보 head tree(주장값 · lock 과 대조)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: box5-ac25-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

env:
  APPROVED_BASE: de3dd4ebaf5b3935a142b988dd61e6198aa9536d
  APPROVED_HEAD: 61ba1bf48d4ce5aa62f256ef80fc84e4e8aafd04
  APPROVED_HEAD_TREE: 313f40cf35b3ee2bf7bcdd946dea9c2e1c4896c2

jobs:
  # ══ 신뢰 검증: 병합된 main 의 보호 코드로만 실행 ══════════════════════
  trusted-verification:
    name: trusted-verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.orchestrate.outputs.ok }}
      candidate_commit: ${{ steps.orchestrate.outputs.candidate_commit }}
      candidate_tree: ${{ steps.orchestrate.outputs.candidate_tree }}
      provenance_base_commit: ${{ steps.orchestrate.outputs.provenance_base_commit }}
      integration_base_commit: ${{ steps.orchestrate.outputs.integration_base_commit }}
      approval_commit: ${{ steps.orchestrate.outputs.approval_commit }}
      approval_document_sha256: ${{ steps.orchestrate.outputs.approval_document_sha256 }}
      identity_manifest_sha256: ${{ steps.orchestrate.outputs.identity_manifest_sha256 }}
      identity_artifact_zip_sha256: ${{ steps.orchestrate.outputs.identity_artifact_zip_sha256 }}
      signing_key_fingerprint: ${{ steps.orchestrate.outputs.signing_key_fingerprint }}
      protected_ref_head: ${{ steps.orchestrate.outputs.protected_ref_head }}
      effective_expiry: ${{ steps.orchestrate.outputs.effective_expiry }}
      protected_state: ${{ steps.orchestrate.outputs.protected_state }}
      coverage_basis: ${{ steps.orchestrate.outputs.coverage_basis }}
      coverage_summary: ${{ steps.orchestrate.outputs.coverage_summary }}
      designated_python_tests: ${{ steps.orchestrate.outputs.designated_python_tests }}
      designated_js_tests: ${{ steps.orchestrate.outputs.designated_js_tests }}
    steps:
      # actions/checkout v4 — 가변 태그가 아니라 커밋으로 고정
      - name: Checkout trusted verifier (merged main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: ac25-trusted

      - name: Assert inputs equal protected lock (before any candidate fetch)
        working-directory: ac25-trusted
        run: |
          set -euo pipefail
          test "${{ github.event.inputs.pr_number }}" = "903" \
            || { echo "::error::INPUT_PR_MISMATCH"; exit 1; }
          test "${{ github.event.inputs.expected_head }}" = "$APPROVED_HEAD" \
            || { echo "::error::INPUT_HEAD_MISMATCH"; exit 1; }
          test "${{ github.event.inputs.expected_tree }}" = "$APPROVED_HEAD_TREE" \
            || { echo "::error::INPUT_TREE_MISMATCH"; exit 1; }

      # 승인 저장소(butler-ct-shared)는 private 이고 후보 저장소는 public 이다.
      # github.token 은 후보 저장소로만 범위가 잡히므로 승인 문서를 읽지 못한다.
      # 토큰이 없으면 우회하지 않고 정확한 코드로 닫는다.
      - name: Require approval-repository read token
        env:
          APPROVAL_READ_TOKEN: ${{ secrets.AC25_APPROVAL_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APPROVAL_READ_TOKEN}" ]; then
            echo "::error::APPROVAL_READ_TOKEN_NOT_CONFIGURED — 승인 저장소는 private 이며 github.token 으로 읽을 수 없다"
            exit 1
          fi

      - name: Fetch candidate objects (no candidate code execution)
        working-directory: ac25-trusted
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$APPROVED_BASE" "$APPROVED_HEAD"

      - name: Run trusted orchestrator (single production entry point)
        id: orchestrate
        working-directory: ac25-trusted
        env:
          PYTHONPATH: scripts/ci
          GH_TOKEN: ${{ secrets.AC25_APPROVAL_READ_TOKEN }}
        run: |
          set -euo pipefail
          # ★로컬 경로 인자를 넘기지 않는다. 승인 좌표는 검증기 안에 고정돼 있다.
          set +e
          python3 -m ac25.orchestrator \
            --pr-number "${{ github.event.inputs.pr_number }}" \
            --run-id "${{ github.run_id }}" \
            --expected-head "${{ github.event.inputs.expected_head }}" \
            --expected-tree "${{ github.event.inputs.expected_tree }}" \
            --verifier-commit "${{ github.sha }}" > verification.json
          STATUS=$?
          set -e
          cat verification.json
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::AC25_TRUSTED_VERIFICATION_FAILED"
            exit "$STATUS"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          receipt = json.load(open("verification.json"))["receipt"]
          keys = [
              "candidate_commit", "candidate_tree", "provenance_base_commit",
              "integration_base_commit", "approval_commit", "approval_document_sha256",
              "identity_manifest_sha256", "identity_artifact_zip_sha256",
              "signing_key_fingerprint", "protected_ref_head", "effective_expiry",
              "protected_state", "coverage_basis", "coverage_summary",
              "designated_python_tests", "designated_js_tests",
          ]
          for key in keys:
              value = receipt.get(key, "")
              if isinstance(value, (list, dict)):
                  value = json.dumps(value)
              print(f"{key}={value}")
          PY

      - name: Run verifier's own contract tests (trusted code)
        working-directory: ac25-trusted
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pytest
          # ★skipped=0 강제는 tests/box5_ac25/conftest.py 가 담당한다.
          python3 -m pytest tests/box5_ac25 -q

  # ══ candidate lane: 후보 코드를 비특권 job 에서 실제로 실행 ═══════════
  candidate-lane:
    name: candidate-lane
    needs: trusted-verification
    if: needs.trusted-verification.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.checks.outputs.result }}
      execution_commit: ${{ steps.identity.outputs.execution_commit }}
      execution_tree: ${{ steps.identity.outputs.execution_tree }}
    steps:
      - name: Checkout candidate at exact approved head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.trusted-verification.outputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact head and tree
        id: identity
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          HEAD_TREE="$(git show -s --format=%T HEAD)"
          test "$HEAD_SHA" = "${{ needs.trusted-verification.outputs.candidate_commit }}" \
            || { echo "::error::CANDIDATE_HEAD_MISMATCH"; exit 1; }
          test "$HEAD_TREE" = "${{ needs.trusted-verification.outputs.candidate_tree }}" \
            || { echo "::error::CANDIDATE_TREE_MISMATCH"; exit 1; }
          echo "execution_commit=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "execution_tree=$HEAD_TREE" >> "$GITHUB_OUTPUT"

      - name: Run designated candidate checks (list derived from the protected lock)
        id: checks
        env:
          PYTHON_TESTS: ${{ needs.trusted-verification.outputs.designated_python_tests }}
          JS_TESTS: ${{ needs.trusted-verification.outputs.designated_js_tests }}
        run: |
          set -euo pipefail
          mapfile -t PY < <(printf '%s' "$PYTHON_TESTS" | python3 -c 'import json,sys
          for path in json.load(sys.stdin): print(path)')
          mapfile -t JS < <(printf '%s' "$JS_TESTS" | python3 -c 'import json,sys
          for path in json.load(sys.stdin): print(path)')
          test "${#PY[@]}" -gt 0 || { echo "::error::NO_DESIGNATED_PYTHON_TESTS"; exit 1; }
          test "${#JS[@]}" -gt 0 || { echo "::error::NO_DESIGNATED_JS_TESTS"; exit 1; }

          python3 -m pip install --quiet --disable-pip-version-check -r requirements.txt
          # ★검사가 실패하면 그대로 실패한다. 목록을 좁히거나 무시하지 않는다.
          python3 -m pytest -q "${PY[@]}"

          npm --prefix butler-desktop ci
          npm --prefix butler-desktop exec -- vitest run "${JS[@]#butler-desktop/}"

          echo "result=success" >> "$GITHUB_OUTPUT"

  # ══ integration lane: 합성 병합 tree 를 대상으로 통합 검사 실행 ═══════
  integration-lane:
    name: integration-lane
    needs: trusted-verification
    if: needs.trusted-verification.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.checks.outputs.result }}
      merge_commit: ${{ steps.merge.outputs.merge_commit }}
      merge_tree: ${{ steps.merge.outputs.merge_tree }}
    steps:
      - name: Checkout base repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and measure synthetic merge coordinate
        id: merge
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/${{ github.event.inputs.pr_number }}/merge"
          MERGE="$(git rev-parse FETCH_HEAD)"
          CANDIDATE="${{ needs.trusted-verification.outputs.candidate_commit }}"
          test "$MERGE" != "$CANDIDATE" \
            || { echo "::error::MERGE_EQUALS_SCOPE_END"; exit 1; }
          PARENTS="$(git rev-list --parents -n 1 "$MERGE" | cut -d' ' -f2-)"
          echo "$PARENTS" | tr ' ' '\n' | grep -qx "$CANDIDATE" \
            || { echo "::error::MERGE_PARENT_MISSING_CANDIDATE"; exit 1; }
          git checkout --detach "$MERGE"
          echo "merge_commit=$MERGE" >> "$GITHUB_OUTPUT"
          echo "merge_tree=$(git show -s --format=%T "$MERGE")" >> "$GITHUB_OUTPUT"

      - name: Run integration checks on the synthetic merge tree
        id: checks
        env:
          PYTHON_TESTS: ${{ needs.trusted-verification.outputs.designated_python_tests }}
          JS_TESTS: ${{ needs.trusted-verification.outputs.designated_js_tests }}
        run: |
          set -euo pipefail
          mapfile -t PY < <(printf '%s' "$PYTHON_TESTS" | python3 -c 'import json,sys
          for path in json.load(sys.stdin): print(path)')
          mapfile -t JS < <(printf '%s' "$JS_TESTS" | python3 -c 'import json,sys
          for path in json.load(sys.stdin): print(path)')
          python3 -m pip install --quiet --disable-pip-version-check -r requirements.txt
          # 정책 scope 는 여전히 base..head 다. 여기서 도는 것은 병합 결과 검사다.
          python3 -m pytest -q "${PY[@]}"
          npm --prefix butler-desktop ci
          npm --prefix butler-desktop exec -- vitest run "${JS[@]#butler-desktop/}"
          echo "result=success" >> "$GITHUB_OUTPUT"

  # ══ publish: 모든 검증 결과와 정확한 OID·digest 를 받은 경우에만 기록 ══
  publish-check:
    name: publish-check
    needs: [trusted-verification, candidate-lane, integration-lane]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      # actions/github-script v7 — 가변 태그가 아니라 커밋으로 고정
      - name: Record trusted exact-head check-run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          EXPECTED_HEAD: ${{ github.event.inputs.expected_head }}
          EXPECTED_TREE: ${{ github.event.inputs.expected_tree }}
        with:
          script: |
            const trusted = ${{ toJSON(needs.trusted-verification.outputs) }};
            const candidate = ${{ toJSON(needs.candidate-lane.outputs) }};
            const integration = ${{ toJSON(needs.integration-lane.outputs) }};

            // ★하나라도 비어 있거나 어긋나면 성공 check-run 을 만들지 않는다.
            const required = [
              "candidate_commit", "candidate_tree", "provenance_base_commit",
              "integration_base_commit", "approval_commit", "approval_document_sha256",
              "identity_manifest_sha256", "identity_artifact_zip_sha256",
              "signing_key_fingerprint", "protected_ref_head", "effective_expiry",
              "protected_state", "coverage_basis", "coverage_summary",
            ];
            const missing = required.filter((key) => !trusted[key]);
            if (missing.length > 0) {
              core.setFailed(`PUBLISH_EVIDENCE_INCOMPLETE: ${missing.join(", ")}`);
              return;
            }
            if (trusted.ok !== "true") {
              core.setFailed("PUBLISH_TRUSTED_VERIFICATION_NOT_OK");
              return;
            }
            if (candidate.result !== "success" || integration.result !== "success") {
              core.setFailed(
                `PUBLISH_LANE_NOT_SUCCESSFUL: candidate=${candidate.result} integration=${integration.result}`,
              );
              return;
            }
            if (!["STATE_1_UNCHANGED", "STATE_2_APPROVED"].includes(trusted.protected_state)) {
              core.setFailed(`PUBLISH_PROTECTED_STATE_INVALID: ${trusted.protected_state}`);
              return;
            }

            // 후보 좌표는 입력 주장값·신뢰 판정·실제 실행 커밋이 모두 같아야 한다.
            const headSha = trusted.candidate_commit;
            const agreements = [
              [process.env.EXPECTED_HEAD, headSha, "input head"],
              [candidate.execution_commit, headSha, "candidate lane execution commit"],
              [process.env.EXPECTED_TREE, trusted.candidate_tree, "input tree"],
              [candidate.execution_tree, trusted.candidate_tree, "candidate lane execution tree"],
            ];
            for (const [observed, expected, label] of agreements) {
              if (observed !== expected) {
                core.setFailed(
                  `PUBLISH_COORDINATE_DISAGREEMENT: ${label} ${observed} != ${expected}`,
                );
                return;
              }
            }
            if (!integration.merge_commit || integration.merge_commit === headSha) {
              core.setFailed(`PUBLISH_MERGE_COORDINATE_INVALID: ${integration.merge_commit}`);
              return;
            }

            const summary = [
              `verifier_commit: ${context.sha}`,
              `candidate_commit: ${headSha}`,
              `candidate_tree: ${trusted.candidate_tree}`,
              `policy_scope_start: ${trusted.provenance_base_commit}`,
              `policy_scope_end: ${headSha}`,
              `integration_comparison_base: ${trusted.integration_base_commit}`,
              `integration_merge_commit: ${integration.merge_commit}`,
              `integration_merge_tree: ${integration.merge_tree}`,
              `approval_commit: ${trusted.approval_commit}`,
              `approval_document_sha256: ${trusted.approval_document_sha256}`,
              `approval_protected_ref_head: ${trusted.protected_ref_head}`,
              `signing_key_fingerprint: ${trusted.signing_key_fingerprint}`,
              `identity_manifest_sha256: ${trusted.identity_manifest_sha256}`,
              `identity_artifact_zip_sha256: ${trusted.identity_artifact_zip_sha256}`,
              `effective_expiry: ${trusted.effective_expiry}`,
              `protected_state: ${trusted.protected_state}`,
              `designated_check_coverage: ${trusted.coverage_summary}`,
              `designated_check_coverage_basis: ${trusted.coverage_basis}`,
              `candidate_lane: ${candidate.result}`,
              `integration_lane: ${integration.result}`,
            ].join("\n");

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "box5-ac25/trusted-exact-head",
              head_sha: headSha,
              status: "completed",
              conclusion: "success",
              output: { title: "AC-25 trusted exact-head verification", summary },
            });
