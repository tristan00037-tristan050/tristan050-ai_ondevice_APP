name: Box5 AC-25 Trusted Verification

# §4-2 단계 B 보호 실행. 병합된 main 에서 workflow_dispatch 로만 돈다.
#
# ★허용 이벤트는 workflow_dispatch 하나뿐이다. pull_request·pull_request_target·
#   push·workflow_run·repository_dispatch 를 두지 않는다. 자기시험은 별도 파일
#   (box5-ac25-stage-a-smoke.yml)에 있다.
# ★최상단 permissions 는 비어 있다. 각 job 이 필요한 만큼만 연다.
# ★입력은 셸 본문에 넣지 않는다. env 로 넘겨 Python 에서 strict 검증한다(M-4).
# ★설치·검사 명령 문자열을 조립하지 않는다. 보호 runner 가 만든다(M-1).
# ★refs/pull/903/merge 는 참고값으로만 관측한다. 판정 대상은 직접 합성한다(M-3).
# ★publish-check 는 always() 다. 실패해도 후보 head 에 도장을 남긴다(M-6).
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 판정 대상 PR 번호(903 고정 대조)
        required: true
        type: string
      expected_head:
        description: 후보 head SHA(주장값 · lock 과 대조)
        required: true
        type: string
      expected_tree:
        description: 후보 head tree(주장값 · lock 과 대조)
        required: true
        type: string

permissions: {}

concurrency:
  group: box5-ac25-trusted
  cancel-in-progress: false

jobs:
  # ══ 신뢰 검증: 병합된 main 의 보호 코드로만 실행 ══════════════════════
  trusted-verification:
    name: trusted-verification
    runs-on: ubuntu-24.04
    environment: ac25-trusted-main
    permissions:
      contents: read
    outputs:
      # ★C6 — 허용 목록 여섯만. receipt 원문은 job output 으로 나가지 않는다.
      verdict: ${{ steps.orchestrate.outputs.verdict }}
      error_code: ${{ steps.orchestrate.outputs.error_code }}
      receipt_sha256: ${{ steps.orchestrate.outputs.receipt_sha256 }}
      candidate_commit: ${{ steps.orchestrate.outputs.candidate_commit }}
      candidate_tree: ${{ steps.orchestrate.outputs.candidate_tree }}
      changed_path_count: ${{ steps.orchestrate.outputs.changed_path_count }}
    steps:
      - name: Checkout trusted verifier (merged main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: ac25-trusted

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Require approval-repository read token
        env:
          APPROVAL_READ_TOKEN: ${{ secrets.AC25_APPROVAL_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APPROVAL_READ_TOKEN}" ]; then
            echo "ERROR_CODE=APPROVAL_READ_TOKEN_NOT_CONFIGURED"
            exit 1
          fi

      - name: Fetch candidate objects (no candidate code execution)
        working-directory: ac25-trusted
        env:
          APPROVED_BASE: de3dd4ebaf5b3935a142b988dd61e6198aa9536d
          APPROVED_HEAD: 61ba1bf48d4ce5aa62f256ef80fc84e4e8aafd04
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${APPROVED_BASE}" "${APPROVED_HEAD}"

      # ★입력은 전부 env 로 간다. run 본문에 inputs 표현식을 쓰지 않는다(M-4).
      - name: Run trusted orchestrator (single production entry point)
        id: orchestrate
        working-directory: ac25-trusted
        env:
          PYTHONPATH: scripts/ci
          PYTHONNOUSERSITE: '1'
          # ★C5 — 두 credential 을 분리한다. 한쪽 열쇠로 다른 쪽 문을 열지 못한다.
          #   승인 저장소 read 는 AC25_APPROVAL_TOKEN 으로만,
          #   후보 저장소·actions read 는 GITHUB_TOKEN 으로만 나간다.
          AC25_APPROVAL_TOKEN: ${{ secrets.AC25_APPROVAL_READ_TOKEN }}
          AC25_CANDIDATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AC25_PR_NUMBER: ${{ inputs.pr_number }}
          AC25_EXPECTED_HEAD: ${{ inputs.expected_head }}
          AC25_EXPECTED_TREE: ${{ inputs.expected_tree }}
        run: |
          set -euo pipefail
          # ★orchestrator 가 허용 목록 값만 GITHUB_OUTPUT 에 직접 쓴다.
          #   워크플로가 receipt 를 cat 하지 않는다(C6).
          set +e
          python3 -m ac25.orchestrator --mode verify
          STATUS=$?
          set -e
          exit "${STATUS}"

  # ══ candidate lane: 후보 코드를 비특권 job 에서 실제로 실행 ═══════════
  candidate-lane:
    name: candidate-lane
    needs: trusted-verification
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout trusted runner (verifier commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: ac25-trusted

      - name: Checkout candidate at approved head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 61ba1bf48d4ce5aa62f256ef80fc84e4e8aafd04
          fetch-depth: 0
          persist-credentials: false
          path: ac25-worktree

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Assert exact head and tree
        id: identity
        working-directory: ac25-worktree
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          HEAD_TREE="$(git show -s --format=%T HEAD)"
          test "${HEAD_SHA}" = "${EXPECTED_HEAD}" \
            || { echo "ERROR_CODE=CANDIDATE_HEAD_MISMATCH"; exit 1; }
          test "${HEAD_TREE}" = "${EXPECTED_TREE}" \
            || { echo "ERROR_CODE=CANDIDATE_TREE_MISMATCH"; exit 1; }
          echo "execution_commit=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "execution_tree=${HEAD_TREE}" >> "${GITHUB_OUTPUT}"

      # ★실행 모듈은 ac25-trusted 에서 온다. 후보는 검사 대상 자리에만 있다.
      - name: Install and run designated checks via protected runner
        env:
          PYTHONPATH: ac25-trusted/scripts/ci
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          python3 -m ac25.stage_b_runner \
            --trusted-root "${GITHUB_WORKSPACE}/ac25-trusted" \
            --worktree "${GITHUB_WORKSPACE}/ac25-worktree" \
            --mode install-and-test

    outputs:
      execution_commit: ${{ steps.identity.outputs.execution_commit }}
      execution_tree: ${{ steps.identity.outputs.execution_tree }}

  # ══ integration lane: 승인 base 와 후보 head 로 직접 합성 ═════════════
  integration-lane:
    name: integration-lane
    needs: trusted-verification
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout trusted runner (verifier commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: ac25-trusted

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # ★GitHub 이 만든 merge ref 는 관측만 하고 판정에 쓰지 않는다.
      - name: Build deterministic synthetic merge and run checks
        id: merge
        env:
          PYTHONPATH: ac25-trusted/scripts/ci
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import os
          from pathlib import Path

          from ac25 import stage_b_runner
          from ac25.integration_merge import (
              build_synthetic_merge,
              cleanup_worktree,
              observe_github_merge_ref,
          )

          BASE = "afdb237e4e6e83d96a182b6c5366a2ad95949bee"
          HEAD = "61ba1bf48d4ce5aa62f256ef80fc84e4e8aafd04"

          trusted = Path(os.environ["GITHUB_WORKSPACE"]) / "ac25-trusted"
          worktree = Path(os.environ["RUNNER_TEMP"]) / "ac25-worktree"
          observed = observe_github_merge_ref(trusted, 903)

          merge = build_synthetic_merge(
              repository=trusted,
              destination=worktree,
              integration_base_commit=BASE,
              candidate_head=HEAD,
              github_merge_ref_observed=observed,
          )
          try:
              plan = stage_b_runner.build_plan(
                  trusted_root=trusted, worktree=merge.worktree
              )
              stage_b_runner.install(plan)
              stage_b_runner.run_checks(plan)
          finally:
              cleanup_worktree(trusted, worktree, raise_on_failure=False)

          # ★C6 — 허용 목록 값만, 한 줄 형식으로 내보낸다.
          import hashlib

          print(f"synthetic_merge_commit={merge.synthetic_merge_commit}")
          print(f"synthetic_merge_tree={merge.merge_tree}")
          print(f"parent_base={merge.parents[0]}")
          print(f"parent_candidate={merge.parents[1]}")
          observed_digest = (
              hashlib.sha256((observed or "NONE").encode("utf-8")).hexdigest()
          )
          print(f"github_merge_ref_observed_sha256={observed_digest}")
          PY

    outputs:
      # ★C6 — 허용 목록 다섯만. GitHub merge ref 는 ★digest 로만★ 남긴다.
      synthetic_merge_commit: ${{ steps.merge.outputs.synthetic_merge_commit }}
      synthetic_merge_tree: ${{ steps.merge.outputs.synthetic_merge_tree }}
      parent_base: ${{ steps.merge.outputs.parent_base }}
      parent_candidate: ${{ steps.merge.outputs.parent_candidate }}
      github_merge_ref_observed_sha256: ${{ steps.merge.outputs.github_merge_ref_observed_sha256 }}

  # ══ publish: ★always(). 실패해도 도장을 남긴다(M-6 · C3) ═════════════
  publish-check:
    name: publish-check
    if: ${{ always() }}
    needs: [trusted-verification, candidate-lane, integration-lane]
    runs-on: ubuntu-24.04
    environment: ac25-trusted-main
    permissions:
      contents: read
      checks: write
    steps:
      # ★보호된 publisher 를 명시적으로 checkout 한다. GITHUB_WORKSPACE 에 무엇이
      #   있는지 보장 없이 local import 하지 않는다(C3).
      - name: Checkout trusted publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: ac25-publisher
          persist-credentials: false

      - name: Publish final check-run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          # ★needs 전체를 JSON 으로 넘기지 않는다. 명시한 필드만 넘긴다(M-4 · C6).
          AC25_TRUSTED_RESULT: ${{ needs.trusted-verification.result }}
          AC25_CANDIDATE_RESULT: ${{ needs.candidate-lane.result }}
          AC25_INTEGRATION_RESULT: ${{ needs.integration-lane.result }}
          AC25_TRUSTED_VERDICT: ${{ needs.trusted-verification.outputs.verdict }}
          AC25_ERROR_CODE: ${{ needs.trusted-verification.outputs.error_code }}
          AC25_RECEIPT_SHA256: ${{ needs.trusted-verification.outputs.receipt_sha256 }}
          AC25_CANDIDATE_COMMIT: ${{ needs.candidate-lane.outputs.execution_commit }}
          AC25_CANDIDATE_TREE: ${{ needs.candidate-lane.outputs.execution_tree }}
          AC25_MERGE_COMMIT: ${{ needs.integration-lane.outputs.synthetic_merge_commit }}
          AC25_MERGE_TREE: ${{ needs.integration-lane.outputs.synthetic_merge_tree }}
          AC25_PARENT_BASE: ${{ needs.integration-lane.outputs.parent_base }}
          AC25_PARENT_CANDIDATE: ${{ needs.integration-lane.outputs.parent_candidate }}
          AC25_REQUESTED_HEAD: ${{ inputs.expected_head }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const moduleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/ac25-publisher/` +
              `scripts/ci/ac25/publish_check.mjs`
            ).href;
            try {
              const { publishCheck } = await import(moduleUrl);
              await publishCheck({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                runUrl: `${context.serverUrl}/${context.repo.owner}/` +
                  `${context.repo.repo}/actions/runs/${context.runId}`,
                evidence: process.env,
              });
            } catch (error) {
              // ★stack·message 를 공개하지 않는다. 짧은 코드만 남긴다.
              const code = /^[A-Z0-9_]{1,64}$/.test(error?.code || '')
                ? error.code : 'CHECK_RUN_PUBLICATION_FAILED';
              core.setFailed(`ERROR_CODE=${code}`);
            }
