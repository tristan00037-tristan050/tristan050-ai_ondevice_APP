name: Box5 AC-25 Trusted Verification

# §4-2 단계 B 보호 실행. 병합된 main 에서 workflow_dispatch 로만 돈다.
#
# ★허용 이벤트는 workflow_dispatch 하나뿐이다. pull_request·pull_request_target·
#   push·workflow_run·repository_dispatch 를 두지 않는다. 자기시험은 별도 파일
#   (box5-ac25-stage-a-smoke.yml)에 있다.
# ★최상단 permissions 는 비어 있다. 각 job 이 필요한 만큼만 연다.
# ★입력은 셸 본문에 넣지 않는다. env 로 넘겨 Python 에서 strict 검증한다(M-4).
# ★설치·검사 명령 문자열을 조립하지 않는다. 보호 runner 가 만든다(M-1).
# ★refs/pull/903/merge 는 참고값으로만 관측한다. 판정 대상은 직접 합성한다(M-3).
# ★publish-check 는 always() 다. 실패해도 후보 head 에 도장을 남긴다(M-6).
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 판정 대상 PR 번호(903 고정 대조)
        required: true
        type: string
      expected_head:
        description: 후보 head SHA(주장값 · lock 과 대조)
        required: true
        type: string
      expected_tree:
        description: 후보 head tree(주장값 · lock 과 대조)
        required: true
        type: string

permissions: {}

concurrency:
  group: box5-ac25-trusted
  cancel-in-progress: false

jobs:
  # ══ 신뢰 검증: 병합된 main 의 보호 코드로만 실행 ══════════════════════
  trusted-verification:
    name: trusted-verification
    runs-on: ubuntu-latest
    environment: ac25-trusted-main
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.orchestrate.outputs.verdict }}
      receipt: ${{ steps.orchestrate.outputs.receipt }}
    steps:
      - name: Checkout trusted verifier (merged main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: ac25-trusted

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Require approval-repository read token
        env:
          APPROVAL_READ_TOKEN: ${{ secrets.AC25_APPROVAL_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APPROVAL_READ_TOKEN}" ]; then
            echo "ERROR_CODE=APPROVAL_READ_TOKEN_NOT_CONFIGURED"
            exit 1
          fi

      - name: Fetch candidate objects (no candidate code execution)
        working-directory: ac25-trusted
        env:
          APPROVED_BASE: de3dd4ebaf5b3935a142b988dd61e6198aa9536d
          APPROVED_HEAD: 61ba1bf48d4ce5aa62f256ef80fc84e4e8aafd04
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${APPROVED_BASE}" "${APPROVED_HEAD}"

      # ★입력은 전부 env 로 간다. run 본문에 inputs 표현식을 쓰지 않는다(M-4).
      - name: Run trusted orchestrator (single production entry point)
        id: orchestrate
        working-directory: ac25-trusted
        env:
          PYTHONPATH: scripts/ci
          PYTHONNOUSERSITE: '1'
          GH_TOKEN: ${{ secrets.AC25_APPROVAL_READ_TOKEN }}
          AC25_PR_NUMBER: ${{ inputs.pr_number }}
          AC25_EXPECTED_HEAD: ${{ inputs.expected_head }}
          AC25_EXPECTED_TREE: ${{ inputs.expected_tree }}
        run: |
          set -euo pipefail
          set +e
          python3 -m ac25.orchestrator --mode verify
          STATUS=$?
          set -e
          {
            echo "verdict=$([ "${STATUS}" -eq 0 ] && echo 1 || echo 0)"
            echo "receipt<<AC25_RECEIPT_EOF"
            cat "${RUNNER_TEMP}/ac25-receipt.json"
            echo "AC25_RECEIPT_EOF"
          } >> "${GITHUB_OUTPUT}"
          exit "${STATUS}"

  # ══ candidate lane: 후보 코드를 비특권 job 에서 실제로 실행 ═══════════
  candidate-lane:
    name: candidate-lane
    needs: trusted-verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted runner (verifier commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: ac25-trusted

      - name: Checkout candidate at approved head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 61ba1bf48d4ce5aa62f256ef80fc84e4e8aafd04
          fetch-depth: 0
          persist-credentials: false
          path: ac25-worktree

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Assert exact head and tree
        id: identity
        working-directory: ac25-worktree
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          HEAD_TREE="$(git show -s --format=%T HEAD)"
          test "${HEAD_SHA}" = "${EXPECTED_HEAD}" \
            || { echo "ERROR_CODE=CANDIDATE_HEAD_MISMATCH"; exit 1; }
          test "${HEAD_TREE}" = "${EXPECTED_TREE}" \
            || { echo "ERROR_CODE=CANDIDATE_TREE_MISMATCH"; exit 1; }
          echo "execution_commit=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "execution_tree=${HEAD_TREE}" >> "${GITHUB_OUTPUT}"

      # ★실행 모듈은 ac25-trusted 에서 온다. 후보는 검사 대상 자리에만 있다.
      - name: Install and run designated checks via protected runner
        env:
          PYTHONPATH: ac25-trusted/scripts/ci
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          python3 -m ac25.stage_b_runner \
            --trusted-root "${GITHUB_WORKSPACE}/ac25-trusted" \
            --worktree "${GITHUB_WORKSPACE}/ac25-worktree" \
            --mode install-and-test

    outputs:
      execution_commit: ${{ steps.identity.outputs.execution_commit }}
      execution_tree: ${{ steps.identity.outputs.execution_tree }}

  # ══ integration lane: 승인 base 와 후보 head 로 직접 합성 ═════════════
  integration-lane:
    name: integration-lane
    needs: trusted-verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted runner (verifier commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: ac25-trusted

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # ★GitHub 이 만든 merge ref 는 관측만 하고 판정에 쓰지 않는다.
      - name: Build deterministic synthetic merge and run checks
        id: merge
        env:
          PYTHONPATH: ac25-trusted/scripts/ci
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import os
          from pathlib import Path

          from ac25 import stage_b_runner
          from ac25.integration_merge import (
              build_synthetic_merge,
              cleanup_worktree,
              observe_github_merge_ref,
          )

          BASE = "afdb237e4e6e83d96a182b6c5366a2ad95949bee"
          HEAD = "61ba1bf48d4ce5aa62f256ef80fc84e4e8aafd04"

          trusted = Path(os.environ["GITHUB_WORKSPACE"]) / "ac25-trusted"
          worktree = Path(os.environ["RUNNER_TEMP"]) / "ac25-worktree"
          observed = observe_github_merge_ref(trusted, 903)

          merge = build_synthetic_merge(
              repository=trusted,
              destination=worktree,
              integration_base_commit=BASE,
              candidate_head=HEAD,
              github_merge_ref_observed=observed,
          )
          try:
              plan = stage_b_runner.build_plan(
                  trusted_root=trusted, worktree=merge.worktree
              )
              stage_b_runner.install(plan)
              stage_b_runner.run_checks(plan)
          finally:
              cleanup_worktree(trusted, worktree, raise_on_failure=False)

          print(f"synthetic_merge_commit={merge.synthetic_merge_commit}")
          print(f"synthetic_merge_tree={merge.merge_tree}")
          print(f"parents={merge.parents[0]},{merge.parents[1]}")
          print(f"github_merge_ref_observed={observed or 'NONE'}")
          print("github_merge_ref_used_for_verdict=NO")
          PY

    outputs:
      synthetic_merge_commit: ${{ steps.merge.outputs.synthetic_merge_commit }}
      synthetic_merge_tree: ${{ steps.merge.outputs.synthetic_merge_tree }}
      parents: ${{ steps.merge.outputs.parents }}
      github_merge_ref_observed: ${{ steps.merge.outputs.github_merge_ref_observed }}

  # ══ publish: ★always(). 실패해도 도장을 남긴다(M-6) ═══════════════════
  publish-check:
    name: publish-check
    if: always()
    needs: [trusted-verification, candidate-lane, integration-lane]
    runs-on: ubuntu-latest
    environment: ac25-trusted-main
    permissions:
      checks: write
      contents: read
    steps:
      # ★후보 코드를 checkout 하지 않는다. 실행하지도 않는다.
      # actions/github-script v7 — 커밋 고정
      - name: Publish final check-run on candidate head
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          # ★JSON 을 JavaScript 소스에 직접 삽입하지 않는다. env 로 넘겨 파싱한다(M-4).
          TRUSTED_RESULT: ${{ needs.trusted-verification.result }}
          CANDIDATE_RESULT: ${{ needs.candidate-lane.result }}
          INTEGRATION_RESULT: ${{ needs.integration-lane.result }}
          TRUSTED_VERDICT: ${{ needs.trusted-verification.outputs.verdict }}
          TRUSTED_RECEIPT: ${{ needs.trusted-verification.outputs.receipt }}
          CANDIDATE_COMMIT: ${{ needs.candidate-lane.outputs.execution_commit }}
          CANDIDATE_TREE: ${{ needs.candidate-lane.outputs.execution_tree }}
          MERGE_COMMIT: ${{ needs.integration-lane.outputs.synthetic_merge_commit }}
          MERGE_TREE: ${{ needs.integration-lane.outputs.synthetic_merge_tree }}
          MERGE_PARENTS: ${{ needs.integration-lane.outputs.parents }}
          MERGE_REF_OBSERVED: ${{ needs.integration-lane.outputs.github_merge_ref_observed }}
          EXPECTED_HEAD: 61ba1bf48d4ce5aa62f256ef80fc84e4e8aafd04
          INTEGRATION_BASE: afdb237e4e6e83d96a182b6c5366a2ad95949bee
        with:
          script: |
            const OID = /^[0-9a-f]{40}$/;
            const HEAD_SHA = process.env.EXPECTED_HEAD;
            const BASE = process.env.INTEGRATION_BASE;

            let errorCode = "OK";
            let receipt = null;

            const fail = (code) => {
              if (errorCode === "OK") errorCode = code;
            };

            // ── 선행 job 결과 ────────────────────────────────────────
            for (const [name, value] of [
              ["TRUSTED", process.env.TRUSTED_RESULT],
              ["CANDIDATE", process.env.CANDIDATE_RESULT],
              ["INTEGRATION", process.env.INTEGRATION_RESULT],
            ]) {
              if (value !== "success") fail(`${name}_JOB_NOT_SUCCESS`);
            }
            if (process.env.TRUSTED_VERDICT !== "1") fail("TRUSTED_VERDICT_NOT_PASS");

            // ── receipt 는 env 로 받아 파싱한다. 소스에 삽입하지 않는다 ──
            try {
              receipt = JSON.parse(process.env.TRUSTED_RECEIPT || "null");
            } catch (_) {
              fail("RECEIPT_NOT_PARSEABLE");
            }
            if (receipt === null || typeof receipt !== "object") {
              fail("RECEIPT_MISSING");
              receipt = {};
            }

            // ── 필수 key 와 값 형식 ──────────────────────────────────
            const requiredOids = [
              "candidate_commit", "candidate_tree", "provenance_base_commit",
              "provenance_base_tree", "integration_base_commit", "approval_commit",
              "protected_ref_head",
            ];
            const requiredDigests = [
              "approval_document_sha256", "identity_manifest_sha256",
              "identity_artifact_zip_sha256", "dependency_manifest_sha256",
            ];
            for (const key of requiredOids) {
              if (!OID.test(String(receipt[key] || ""))) fail("RECEIPT_OID_INVALID");
            }
            for (const key of requiredDigests) {
              if (!/^[0-9a-f]{64}$/.test(String(receipt[key] || ""))) {
                fail("RECEIPT_DIGEST_INVALID");
              }
            }
            if (receipt.verdict !== 1) fail("RECEIPT_VERDICT_NOT_PASS");
            if (!["STATE_1_UNCHANGED", "STATE_2_APPROVED"].includes(receipt.protected_state)) {
              fail("RECEIPT_PROTECTED_STATE_INVALID");
            }
            if (receipt.coverage_uncovered_count !== 0) fail("RECEIPT_COVERAGE_GAP");

            // ── 후보 좌표 일치 ──────────────────────────────────────
            if (receipt.candidate_commit !== HEAD_SHA) fail("CANDIDATE_COORDINATE_MISMATCH");
            if (process.env.CANDIDATE_COMMIT !== HEAD_SHA) fail("CANDIDATE_EXECUTION_MISMATCH");
            if (process.env.CANDIDATE_TREE !== receipt.candidate_tree) {
              fail("CANDIDATE_TREE_MISMATCH");
            }

            // ── 합성 merge 부모·tree 일치 ───────────────────────────
            const parents = String(process.env.MERGE_PARENTS || "").split(",");
            if (!OID.test(String(process.env.MERGE_COMMIT || ""))) fail("MERGE_COMMIT_INVALID");
            if (!OID.test(String(process.env.MERGE_TREE || ""))) fail("MERGE_TREE_INVALID");
            if (parents.length !== 2 || parents[0] !== BASE || parents[1] !== HEAD_SHA) {
              fail("MERGE_PARENT_MISMATCH");
            }
            if (process.env.MERGE_COMMIT === HEAD_SHA) fail("MERGE_EQUALS_SCOPE_END");

            // ── 요약은 meta-only 좌표와 ERROR_CODE 만 담는다(§9) ─────
            const conclusion = errorCode === "OK" ? "success" : "failure";
            const summary = [
              `verdict=${conclusion === "success" ? 1 : 0}`,
              `error_code=${errorCode}`,
              `verifier_commit=${context.sha}`,
              `candidate_commit=${HEAD_SHA}`,
              `candidate_tree=${receipt.candidate_tree || "NONE"}`,
              `provenance_base_commit=${receipt.provenance_base_commit || "NONE"}`,
              `integration_base_commit=${BASE}`,
              `synthetic_merge_commit=${process.env.MERGE_COMMIT || "NONE"}`,
              `synthetic_merge_tree=${process.env.MERGE_TREE || "NONE"}`,
              `parents=${process.env.MERGE_PARENTS || "NONE"}`,
              `github_merge_ref_observed=${process.env.MERGE_REF_OBSERVED || "NONE"}`,
              `github_merge_ref_used_for_verdict=NO`,
              `approval_commit=${receipt.approval_commit || "NONE"}`,
              `approval_document_sha256=${receipt.approval_document_sha256 || "NONE"}`,
              `identity_manifest_sha256=${receipt.identity_manifest_sha256 || "NONE"}`,
              `dependency_manifest_sha256=${receipt.dependency_manifest_sha256 || "NONE"}`,
              `changed_path_count=${receipt.changed_path_count ?? "NONE"}`,
              `offending_path_count=${receipt.offending_path_count ?? "NONE"}`,
              `protected_state=${receipt.protected_state || "NONE"}`,
              `effective_expiry=${receipt.effective_expiry || "NONE"}`,
              `designated_check_coverage=${receipt.coverage_covered_count ?? "NONE"}` +
                `/${receipt.coverage_entry_count ?? "NONE"}`,
              `designated_check_coverage_basis=${receipt.coverage_basis || "NONE"}`,
            ].join("\n");

            // ★실패라고 발행을 생략하지 않는다(M-6).
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "box5-ac25/trusted-exact-head",
                head_sha: HEAD_SHA,
                status: "completed",
                conclusion,
                output: { title: "AC-25 trusted exact-head verification", summary },
              });
            } catch (_) {
              core.setFailed("CHECK_RUN_PUBLICATION_FAILED");
              return;
            }
            if (conclusion !== "success") {
              core.setFailed(`ERROR_CODE=${errorCode}`);
            }
