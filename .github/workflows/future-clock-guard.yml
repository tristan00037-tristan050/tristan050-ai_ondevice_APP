name: Future-Clock Guard

# 하드코딩된 만료일(예: 2026-12-31)이 real now 와 비교되어, 그 날짜가 지나면
# 시험 결과가 뒤집혀 저장소가 막히는 "시한폭탄"을 미리 잡는다.
# 같은 시험을 real now / far-future 로 두 번 돌려 결과가 달라지면 탐지한다.
# now 를 주입하는 시험은 미래에서도 결과가 같으므로 잡히지 않는다(거짓양성 0).
# 알려진 baseline(scripts/ci/future_clock_allowlist.txt)에 없는 '새' 시한폭탄에만 FAIL.

on:
  pull_request:
    paths:
      - 'butler_pc_core/connect_loop/**'
      - 'tests/connect_loop/**'
      - 'scripts/ci/future_clock_guard.py'
      - 'scripts/ci/future_clock_allowlist.txt'
      - '.github/workflows/future-clock-guard.yml'
  push:
    branches: [main]
    paths:
      - 'butler_pc_core/connect_loop/**'
      - 'tests/connect_loop/**'
      - 'scripts/ci/future_clock_guard.py'
      - 'scripts/ci/future_clock_allowlist.txt'
      - '.github/workflows/future-clock-guard.yml'

jobs:
  future-clock-guard:
    name: future-clock guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run future-clock guard (real now vs 2027-06-01)
        env:
          PYTHONPATH: .
        run: |
          python scripts/ci/future_clock_guard.py --scope tests/connect_loop
